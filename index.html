<style>
/* Layout: sidebar app shell (icon rail on tablets, bottom tab bar on phones), side drawer for details; dark navy brand ground first, light theme mirrored; full RTL for Arabic via logical properties. */
:root{
  --bg:#0B0D17; --surface:#121524; --surface-2:#181C2E; --surface-3:#20253B; --line:#272C45; --line-2:#343A58;
  --fg:#F4F2EE; --fg-2:#B4B2C8; --muted:#7D7E98;
  --violet:#8B63F7; --coral:#F05A35; --coral-deep:#8E3A2B; --ink-on-accent:#FFFFFF;
  --c-faisal:var(--violet); --c-abd:var(--coral);
  --good:#3DBE86; --warn:#E9B341; --bad:#FF5C7A; --info:#6EA8FF;
  --tint-violet:rgba(139,99,247,.16); --tint-coral:rgba(240,90,53,.16); --tint-good:rgba(61,190,134,.15);
  --tint-warn:rgba(233,179,65,.15); --tint-bad:rgba(255,92,122,.15); --tint-info:rgba(110,168,255,.15); --tint-pink:rgba(232,92,170,.16); --tint-teal:rgba(47,191,174,.15);
  --pink:#EC74B8; --teal:#3CC9B8;
  --shadow:0 18px 50px rgba(0,0,0,.45);
  --dot:rgba(255,255,255,.06);
  --f-brand:"Archivo","Arial Black","Helvetica Neue",Arial,sans-serif;
  --f-display:"Archivo","Arial Black","Helvetica Neue",Arial,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#F5F4F1; --surface:#FFFFFF; --surface-2:#F0EFF5; --surface-3:#E6E4EF; --line:#E3E1EA; --line-2:#D2CFDD;
  --fg:#11131F; --fg-2:#4D4E66; --muted:#7A7B92;
  --violet:#6A3FE6; --coral:#E04E2A; --coral-deep:#B5462E;
  --good:#18925C; --warn:#A87406; --bad:#D22D52; --info:#2F6FD6;
  --tint-violet:rgba(106,63,230,.10); --tint-coral:rgba(224,78,42,.10); --tint-good:rgba(24,146,92,.10);
  --tint-warn:rgba(168,116,6,.12); --tint-bad:rgba(210,45,82,.10); --tint-info:rgba(47,111,214,.10); --tint-pink:rgba(196,51,133,.10); --tint-teal:rgba(17,140,126,.10);
  --pink:#C43385; --teal:#118C7E;
  --shadow:0 18px 50px rgba(17,19,31,.16); --dot:rgba(17,19,31,.07);
  color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#F5F4F1; --surface:#FFFFFF; --surface-2:#F0EFF5; --surface-3:#E6E4EF; --line:#E3E1EA; --line-2:#D2CFDD;
  --fg:#11131F; --fg-2:#4D4E66; --muted:#7A7B92;
  --violet:#6A3FE6; --coral:#E04E2A; --coral-deep:#B5462E;
  --good:#18925C; --warn:#A87406; --bad:#D22D52; --info:#2F6FD6;
  --tint-violet:rgba(106,63,230,.10); --tint-coral:rgba(224,78,42,.10); --tint-good:rgba(24,146,92,.10);
  --tint-warn:rgba(168,116,6,.12); --tint-bad:rgba(210,45,82,.10); --tint-info:rgba(47,111,214,.10); --tint-pink:rgba(196,51,133,.10); --tint-teal:rgba(17,140,126,.10);
  --pink:#C43385; --teal:#118C7E;
  --shadow:0 18px 50px rgba(17,19,31,.16); --dot:rgba(17,19,31,.07);
  color-scheme:light;
}
:root[lang="ar"]{
  --f-display:"Cairo","IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Figtree",Tahoma,"Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
a{color:inherit}
:focus-visible{outline:2px solid var(--violet);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{margin:0;text-wrap:balance}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:12px;letter-spacing:-.01em}
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:600}
:root[lang="ar"] .eyebrow,:root[lang="ar"] .sec-h h3,:root[lang="ar"] .day-h{letter-spacing:0;text-transform:none;font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
[dir="rtl"] .ic.flip{transform:scaleX(-1)}
.ltr{direction:ltr;unicode-bidi:isolate}

/* Wordmark (always Latin brand type) */
.wm{display:flex;flex-direction:column;line-height:.86;direction:ltr}
.wm b{font-family:var(--f-brand);font-stretch:125%;font-weight:900;letter-spacing:-.01em;font-size:56px;color:var(--fg)}
.wm span{font-family:var(--f-brand);font-stretch:125%;font-weight:300;letter-spacing:.42em;font-size:26px;color:var(--fg-2);margin-top:12px}
.wm.sm b{font-size:19px}
.wm.sm span{font-size:9px;margin-top:5px;letter-spacing:.5em}
.logo{display:block;flex:none;max-width:100%;height:auto}
.logo .pill{fill:var(--fg)}

/* Language switch */
.langbtn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 11px;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--fg-2);font-size:13px;font-weight:600;white-space:nowrap}
.langbtn:hover{color:var(--fg);background:var(--surface-2)}
.langbtn .ic{width:16px;height:16px}
.langbtn .ar{font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif}
.langbtn .en{font-family:"Figtree",Arial,sans-serif}

/* Login */
.login{min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:1.15fr 1fr}
.login-brand{--bg:#0B0D17;--fg:#F4F2EE;--fg-2:#B4B2C8;--muted:#7D7E98;--line:#272C45;--dot:rgba(255,255,255,.06);--coral-deep:#8E3A2B;color:var(--fg);
  position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:40px;
  padding-block:44px;padding-left:max(48px,env(safe-area-inset-left,0px));padding-right:max(48px,env(safe-area-inset-right,0px));
  background-color:var(--bg);background-image:radial-gradient(var(--dot) 1px,transparent 1.2px);background-size:22px 22px;border-inline-end:1px solid var(--line);min-width:0}
.lb-row{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.lockup{display:flex;align-items:center;gap:36px;flex-wrap:wrap;direction:ltr}
[dir="rtl"] .lockup{justify-content:flex-end}
.lb-foot{display:flex;justify-content:space-between;align-items:center;gap:16px;border-top:1px solid var(--line);padding-top:20px;color:var(--fg-2);flex-wrap:wrap}
.dots{display:flex;gap:8px}.dots i{width:10px;height:10px;border-radius:50%;background:var(--violet)}.dots i:nth-child(2){background:var(--coral)}.dots i:nth-child(3){background:var(--fg)}
.login-panel{display:flex;align-items:center;justify-content:center;padding-block:40px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));background:var(--surface);min-width:0}
.lp-inner{width:100%;max-width:400px;display:flex;flex-direction:column;gap:22px}
.lp-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.lp-inner h1{font-family:var(--f-display);font-stretch:112%;font-weight:800;font-size:28px;letter-spacing:-.01em}
:root[lang="ar"] .lp-inner h1,:root[lang="ar"] .ph h1{letter-spacing:0}
.lp-sub{color:var(--fg-2)}
.who{display:flex;align-items:center;gap:14px;width:100%;text-align:start;padding:16px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);transition:border-color .15s,transform .15s}
.who:hover{border-color:var(--line-2);transform:translateY(-1px)}
.who b{display:block;font-size:16px}
.who small{color:var(--muted);font-size:12.5px}
.who .go{margin-inline-start:auto;color:var(--muted)}
.av{width:30px;height:30px;border-radius:50%;background:var(--violet);color:#fff;display:inline-grid;place-items:center;font-weight:700;font-size:13px;flex:none;font-family:var(--f-display);font-stretch:110%;line-height:1}
.av.lg{width:48px;height:48px;font-size:19px}
.av.xl{width:64px;height:64px;font-size:26px}
.av.sm{width:22px;height:22px;font-size:10px}
.avs{display:inline-flex}.avs .av+.av{margin-inline-start:-7px;box-shadow:0 0 0 2px var(--surface)}
.pin-head{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.pin-dots{display:flex;justify-content:center;gap:16px;margin-block:4px;direction:ltr}
.pin-dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line-2)}
.pin-dots i.on{background:var(--fg);border-color:var(--fg)}
.pin-dots.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;direction:ltr}
.pad button{height:56px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.pad button:hover{background:var(--surface-3)}
.pad button:disabled{visibility:hidden}
.err{color:var(--bad);font-size:13px;min-height:20px;text-align:center}
.linkbtn{background:none;border:0;padding:0;color:var(--fg-2);text-decoration:underline;text-underline-offset:3px}
.notice{padding:14px 16px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);color:var(--fg-2)}
.notice b{color:var(--fg)}

/* Shell */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh;min-height:100dvh}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;height:100dvh;display:flex;flex-direction:column;gap:28px;padding-block:24px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));border-inline-end:1px solid var(--line);background:var(--surface)}
.side-brand{display:flex;align-items:center;gap:12px;padding-inline:6px;direction:ltr}
[dir="rtl"] .side-brand{justify-content:flex-end}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;text-decoration:none;color:var(--fg-2);font-weight:500}
.nav a:hover{background:var(--surface-2);color:var(--fg)}
.nav a.on{background:var(--surface-3);color:var(--fg)}
.nav a.on .ic{color:var(--violet)}
.nav em{margin-inline-start:auto;font-style:normal;font-size:11.5px;font-weight:600;min-width:22px;text-align:center;padding:1px 7px;border-radius:999px;background:var(--surface-3);color:var(--fg-2);font-variant-numeric:tabular-nums}
.nav a.on em{background:var(--bg)}
.side-lang{display:flex}
.side-lang .langbtn{width:100%;justify-content:center}
.side-foot{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;background:var(--surface-2)}
.side-lang + .side-foot{margin-top:0}
.side-foot b{display:block;font-size:13.5px}.side-foot small{color:var(--muted);font-size:12px}
.iconbtn{margin-inline-start:auto;display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--fg-2);flex:none}
.iconbtn:hover{color:var(--fg);background:var(--surface-3)}
.main{min-width:0;padding-block:28px 64px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}
.wrap{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.mhead{display:none}

/* Page header */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.ph h1{font-family:var(--f-display);font-stretch:118%;font-weight:800;font-size:30px;letter-spacing:-.015em;margin-top:6px}
.ph-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:38px;padding:0 15px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);font-weight:600;font-size:13.5px;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--violet);border-color:transparent;color:var(--ink-on-accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.good{background:var(--good);border-color:transparent;color:#fff}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn.danger.solid{background:var(--bad);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--fg-2)}
.btn.sm{min-height:30px;padding:0 10px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.banner{padding:12px 16px;border-radius:12px;border:1px solid var(--line);background:var(--tint-warn);color:var(--fg)}

/* Cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card-h h2{font-size:15px;font-weight:700}
.card-h p{color:var(--muted);font-size:12.5px}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:18px}
.g2.even{grid-template-columns:repeat(2,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:4px;text-decoration:none;min-width:0}
.kpi:hover{border-color:var(--line-2)}
.kpi .k-l{color:var(--fg-2);font-size:12.5px;font-weight:600}
.kpi .k-v{font-family:var(--f-display);font-stretch:112%;font-weight:800;font-size:32px;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .k-s{font-size:12.5px;color:var(--muted)}
.kpi .k-s.bad{color:var(--bad)}

/* Segmented + filters */
.seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);gap:2px;max-width:100%}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;font-size:13px;font-weight:600;color:var(--fg-2);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.seg.status{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.seg.status button{padding:7px 4px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sel,.inp{height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 11px;font-size:13.5px;min-width:0;max-width:100%}
.search{position:relative;flex:1 1 200px;max-width:320px}
.search .ic{position:absolute;inset-inline-start:10px;top:9px;color:var(--muted)}
.search input{width:100%;padding-inline-start:34px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--fg-2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--fg);border-color:var(--violet)}
.tabs button em{font-style:normal;color:var(--muted);margin-inline-start:6px;font-variant-numeric:tabular-nums}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:6px;min-height:22px;padding:0 8px;border-radius:6px;font-size:11.5px;font-weight:600;white-space:nowrap;background:var(--surface-3);color:var(--fg-2)}
.chip.website{background:var(--tint-violet);color:var(--violet)}
.chip.reels{background:var(--tint-coral);color:var(--coral)}
.chip.posts{background:var(--tint-pink);color:var(--pink)}
.chip.page{background:var(--tint-teal);color:var(--teal)}
.chip.st-potential{background:var(--tint-info);color:var(--info)}
.chip.st-discussion{background:var(--tint-violet);color:var(--violet)}
.chip.st-closing{background:var(--tint-warn);color:var(--warn)}
.chip.st-client{background:var(--tint-good);color:var(--good)}
.chip.st-lost{background:var(--tint-bad);color:var(--bad)}
.chip.sgc-doctor{background:var(--tint-teal);color:var(--teal)}
.chip.sgc-store{background:var(--tint-violet);color:var(--violet)}
.chip.sgc-restaurant{background:var(--tint-coral);color:var(--coral)}
.chip.sgc-beauty{background:var(--tint-pink);color:var(--pink)}
.chip.sgc-realestate{background:var(--tint-info);color:var(--info)}
.chip.sgc-company{background:var(--tint-warn);color:var(--warn)}
.fchips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin;max-width:100%}
.fchip{display:inline-flex;align-items:center;gap:7px;min-height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg-2);font-weight:600;font-size:13px;white-space:nowrap}
.fchip:hover{border-color:var(--line-2);color:var(--fg)}
.fchip.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.fchip em{font-style:normal;font-size:11.5px;opacity:.7;font-variant-numeric:tabular-nums}
.fchip .dot{width:8px;height:8px;border-radius:50%}
.chip.hi{background:var(--tint-bad);color:var(--bad)}
.chip.new{background:var(--coral);color:#fff}
.due{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);white-space:nowrap}
.due.soon{color:var(--warn)}.due.over{color:var(--bad);font-weight:600}
.due .ic{width:14px;height:14px}

/* Board */
.board{display:grid;grid-template-columns:repeat(var(--cols,4),minmax(250px,1fr));gap:14px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:180px;scroll-snap-align:start;min-width:0}
.col.drop{border-color:var(--violet);background:var(--tint-violet)}
.col-h{display:flex;align-items:center;gap:8px;padding:2px 4px 4px}
.col-h b{font-size:13px}
.col-h em{font-style:normal;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.col-h .sw{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.col-empty{color:var(--muted);font-size:12.5px;padding:14px 6px;text-align:center;border:1px dashed var(--line-2);border-radius:12px}
.tcard{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 12px 11px;display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:border-color .15s;min-width:0}
.tcard:hover{border-color:var(--line-2)}
.tcard.dragging{opacity:.5}
.tcard h4{font-size:14px;font-weight:600;line-height:1.4;overflow-wrap:anywhere}
.tc-top{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tc-client{font-size:12.5px;color:var(--fg-2);overflow-wrap:anywhere}
.tc-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.prog{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted)}
.prog .bar{flex:1;height:4px;border-radius:4px;background:var(--surface-3);overflow:hidden}
.prog .bar span{display:block;height:100%;background:var(--violet);border-radius:4px}
.stamp{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--fg-2);padding-top:8px;border-top:1px solid var(--line);flex-wrap:wrap}
.stamp .ic{width:14px;height:14px;color:var(--good)}
.more{align-self:center}

/* Queue list */
.list{display:flex;flex-direction:column}
.qi{display:flex;gap:12px;align-items:flex-start;padding:11px 2px;border-top:1px solid var(--line)}
.qi:first-child{border-top:0}
.ck{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--line-2);background:transparent;display:grid;place-items:center;color:transparent;flex:none;margin-top:1px}
.ck:hover{border-color:var(--good);color:var(--good)}
.ck.on{background:var(--good);border-color:var(--good);color:#fff}
.ck .ic{width:14px;height:14px;stroke-width:2.6}
.qi-main{flex:1;min-width:0;cursor:pointer}
.qi-main b{font-weight:600;display:block;overflow-wrap:anywhere}
.qi-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:4px;font-size:12px;color:var(--muted)}
.empty{padding:26px 10px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty b{color:var(--fg);font-size:14.5px}

/* Chart */
.legend{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:6px}
.legend span{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--fg-2)}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend b{color:var(--fg);font-variant-numeric:tabular-nums}
.chart{position:relative;direction:ltr}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .base{stroke:var(--line-2);stroke-width:1}
.chart text{fill:var(--muted);font-family:var(--f-body);font-size:11px}
.chart .hit{fill:transparent;cursor:default}
.chart .hit:hover{fill:var(--surface-2)}
.tip{position:absolute;pointer-events:none;background:var(--surface-3);border:1px solid var(--line-2);border-radius:10px;padding:8px 10px;font-size:12px;box-shadow:var(--shadow);white-space:nowrap;z-index:3}
[dir="rtl"] .tip{direction:rtl}
.tip b{display:block;margin-bottom:3px}
.tip div{display:flex;align-items:center;gap:7px;color:var(--fg-2)}
.tip i{width:8px;height:8px;border-radius:2px;display:inline-block}
.split{display:flex;height:10px;border-radius:6px;overflow:hidden;gap:2px;margin-top:6px;background:var(--surface-3)}
.split span{display:block;height:100%}
details.tbl{margin-top:10px}
details.tbl summary{cursor:pointer;color:var(--fg-2);font-size:12.5px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:start;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:12px}
td.n,th.n{text-align:end;font-variant-numeric:tabular-nums}

/* Pipeline glance */
.pipe{display:flex;flex-direction:column;gap:10px}
.pipe-row{display:grid;grid-template-columns:minmax(90px,130px) 1fr 32px;align-items:center;gap:12px;font-size:13px;text-decoration:none}
.pipe-row .track{height:8px;border-radius:6px;background:var(--surface-3);overflow:hidden}
.pipe-row .track span{display:block;height:100%;border-radius:6px}
.pipe-row b{text-align:end;font-variant-numeric:tabular-nums}

/* Feed */
.feed{display:flex;flex-direction:column}
.fi{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:9px 0;border-top:1px solid var(--line)}
.fi:first-child{border-top:0}
.fi p{font-size:13.5px;color:var(--fg-2);overflow-wrap:anywhere}
.fi p b{color:var(--fg);font-weight:600}
.fi .mono{color:var(--muted);padding-top:2px;white-space:nowrap}
.day-h{font-size:12px;font-weight:700;color:var(--fg-2);padding:14px 0 4px;letter-spacing:.04em;text-transform:uppercase}

/* Rows */
.lcard .tc-client{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer}
.row:hover{border-color:var(--line-2)}
.row b{display:block;overflow-wrap:anywhere}
.row small{color:var(--muted);font-size:12.5px}

/* Portfolio */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(290px,100%),1fr));gap:18px}
.proj{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.cover{position:relative;aspect-ratio:16/9;max-width:100%;overflow:hidden;background:var(--bg);background-image:radial-gradient(var(--dot) 1px,transparent 1.2px);background-size:16px 16px;display:grid;place-items:center;padding:18px}
.browser{width:88%;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);overflow:hidden;box-shadow:var(--shadow)}
.browser .bar{display:flex;align-items:center;gap:5px;padding:7px 9px;border-bottom:1px solid var(--line);background:var(--surface-2);direction:ltr}
.browser .bar i{width:6px;height:6px;border-radius:50%;background:var(--line-2)}
.browser .bar span{margin-left:8px;font-family:var(--f-mono);font-size:10.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.browser .pg{padding:14px;display:flex;flex-direction:column;gap:7px}
.browser .pg b{font-family:var(--f-display);font-stretch:115%;font-weight:800;font-size:17px;line-height:1.2;overflow-wrap:anywhere}
.browser .pg i{display:block;height:6px;border-radius:4px;background:var(--surface-3)}
.browser .pg i.acc{width:38%;height:10px;background:linear-gradient(90deg,var(--violet),var(--coral))}
.igrid{display:grid;grid-template-columns:repeat(3,44px);gap:4px}
.igrid i{width:44px;height:44px;border-radius:5px;background:var(--surface-3)}
.igrid i:nth-child(2n){background:var(--tint-violet)}.igrid i:nth-child(3n){background:var(--tint-coral)}
.igrid i:nth-child(5){background:linear-gradient(135deg,var(--violet),var(--coral))}
.cover .tag{position:absolute;inset-inline-start:12px;top:12px}
.proj-b{padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px;flex:1}
.proj-b h3{font-size:16px;font-weight:700;overflow-wrap:anywhere}
.proj-b .client{color:var(--fg-2);font-size:13px}
.proj-b p.sum{color:var(--fg-2);font-size:13.5px;overflow-wrap:anywhere}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.proj-f{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:12px;border-top:1px solid var(--line)}
.proj-f .due{margin-inline-start:auto}
.extl{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13px;text-decoration:none;color:var(--violet)}
.extl:hover{text-decoration:underline}
.extl .ic{width:15px;height:15px}

/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(5,6,12,.55);z-index:40}
.scrim.anim{animation:fade .15s}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(600px,100%);background:var(--surface);border-inline-start:1px solid var(--line);z-index:41;display:flex;flex-direction:column;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer.anim{animation:slide .2s ease-out}
[dir="rtl"] .drawer.anim{animation-name:slidertl}
@keyframes slide{from{transform:translateX(24px);opacity:.4}}
@keyframes slidertl{from{transform:translateX(-24px);opacity:.4}}
@keyframes fade{from{opacity:0}}
.d-head{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.d-head .meta{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere;min-width:0}
.d-head h2{font-size:17px;flex:1}
.d-body{flex:1;overflow-y:auto;padding:20px 20px 40px;display:flex;flex-direction:column;gap:22px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.d-body > *{flex-shrink:0}
.title-in{width:100%;border:1px solid transparent;background:transparent;font-family:var(--f-display);font-stretch:108%;font-weight:800;font-size:22px;line-height:1.35;padding:6px 8px;margin-inline-start:-8px;border-radius:10px;resize:none;overflow:hidden}
.title-in:hover{border-color:var(--line)}
.title-in:focus{border-color:var(--line-2);background:var(--surface-2);outline:none}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld.full{grid-column:1/-1}
.fld label,.lbl{font-size:12px;font-weight:600;color:var(--fg-2)}
.fld .inp,.fld .sel{width:100%;height:40px}
textarea.inp{height:auto;min-height:84px;padding:9px 11px;resize:vertical;line-height:1.5;width:100%}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sec-h h3{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-2)}
.sec-h small{color:var(--muted);font-size:12px}
.steps{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.step{display:flex;gap:11px;align-items:flex-start;padding:10px 12px;border-top:1px solid var(--line);background:var(--surface)}
.step:first-child{border-top:0}
.step .txt{flex:1;min-width:0}
.step .txt span{display:block;overflow-wrap:anywhere}
.step.done .txt span{color:var(--muted);text-decoration:line-through}
.step .by{font-size:11.5px;color:var(--muted);margin-top:2px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.step .x{border:0;background:none;color:var(--muted);padding:4px;border-radius:6px;opacity:.6}
.step .x:hover{opacity:1;color:var(--bad)}
.addrow{display:flex;gap:8px}
.addrow .inp{flex:1;height:40px}
.stepper{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.stepper button{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);text-align:start;min-width:0}
.stepper button b{font-size:12.5px}
.stepper button small{font-size:11px;color:var(--muted);font-family:var(--f-mono)}
.stepper button.past{border-color:transparent;background:var(--tint-violet)}
.stepper button.cur{border-color:var(--violet);background:var(--tint-violet)}
.stepper button.cur.client{border-color:var(--good);background:var(--tint-good)}
.tl{display:flex;flex-direction:column;border-inline-start:2px solid var(--line);margin-inline-start:6px}
.tl-i{position:relative;padding-bottom:12px;padding-inline-start:18px;font-size:13px;color:var(--fg-2)}
.tl-i::before{content:"";position:absolute;inset-inline-start:-6px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--line-2)}
.tl-i b{color:var(--fg);font-weight:600}
.tl-i .mono{display:block;color:var(--muted);margin-top:1px}
.note{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface-2);display:flex;flex-direction:column;gap:8px}
.note-h{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--fg-2);flex-wrap:wrap}
.note-h .mono{color:var(--muted)}
.note-h .end{margin-inline-start:auto}
.note p{white-space:pre-wrap;overflow-wrap:anywhere}
.phone{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lostbox{border:1px solid color-mix(in srgb,var(--bad) 35%,transparent);background:var(--tint-bad);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.callout{border-radius:12px;padding:12px 14px;background:var(--tint-good);display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.d-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.d-actions .grow{flex:1}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--fg-2)}
.check-l{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--fg-2)}
.check-l input{margin-top:3px;accent-color:var(--violet);width:18px;height:18px;flex:none}

/* Toasts */
#toasts{position:fixed;inset-inline-end:max(20px,env(safe-area-inset-right,0px));bottom:max(20px,env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column;gap:8px;max-width:min(380px,calc(100vw - 32px))}
.toast{background:var(--surface-3);border:1px solid var(--line-2);border-inline-start:3px solid var(--violet);border-radius:12px;padding:11px 14px;box-shadow:var(--shadow);font-size:13.5px;animation:fade .2s}
.toast.bad{border-inline-start-color:var(--bad)}.toast.good{border-inline-start-color:var(--good)}.toast.coral{border-inline-start-color:var(--coral)}
.toast b{font-weight:700}
.skel{color:var(--muted);padding:40px;text-align:center}

/* ---------- Carousel / Stories task chips ---------- */
.chip.carousel{background:var(--tint-info);color:var(--info)}
.chip.stories{background:var(--tint-warn);color:var(--warn)}
.nav em.bad,.nav a.on em.bad{background:var(--bad);color:#fff}

/* ---------- Weekly target ---------- */
.wk{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:center}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
[dir="rtl"] .ring svg{transform:rotate(-90deg) scaleY(-1)}
.ring .trk{fill:none;stroke:var(--surface-3);stroke-width:12}
.ring .val{fill:none;stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset .6s ease}
.ring .lbl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.ring .lbl b{font-family:var(--f-brand);font-stretch:112%;font-weight:800;font-size:28px;font-variant-numeric:tabular-nums}
.ring .lbl small{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.wk-info{display:flex;flex-direction:column;gap:10px;min-width:0}
.wk-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.wk-top h2{font-size:15px;font-weight:700}
.wk-top p{color:var(--muted);font-size:12.5px}
.pace{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:999px}
.pace.good{background:var(--tint-good);color:var(--good)}.pace.warn{background:var(--tint-warn);color:var(--warn)}
.days7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;align-items:end;height:58px}
.days7 div{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.days7 i{display:block;width:100%;max-width:26px;border-radius:5px 5px 2px 2px;background:var(--violet);min-height:3px;opacity:.9}
.days7 i.zero{background:var(--surface-3)}
.days7 .today i{box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--violet)}
.days7 span{font-size:10.5px;color:var(--muted)}
.wk-edit{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.wk-edit .inp{width:110px}

/* ---------- Portfolio: client tiles & profile ---------- */
.sec-title{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-title h2{font-family:var(--f-display);font-stretch:112%;font-weight:800;font-size:19px}
.sec-title p{color:var(--muted);font-size:12.5px}
.sec-title > *{min-width:0;max-width:100%}
.sec-title .filters{flex-wrap:nowrap}
.sec-title .seg{overflow-x:auto;scrollbar-width:thin}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:16px}
.ctile{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px;cursor:pointer;overflow:hidden;transition:border-color .15s,transform .15s;min-width:0}
.ctile:hover{border-color:var(--line-2);transform:translateY(-2px)}
.ctile::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:linear-gradient(90deg,var(--violet),var(--coral))}
.ct-head{display:flex;gap:12px;align-items:center;min-width:0}
.cmono{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:#fff;font-family:var(--f-brand);font-stretch:110%;font-weight:800;font-size:17px;flex:none;background:linear-gradient(135deg,var(--violet),var(--coral));letter-spacing:.02em}
.cmono.lg{width:64px;height:64px;font-size:23px;border-radius:18px}
.ct-head b{display:block;font-size:15.5px;overflow-wrap:anywhere}
.ct-head small{color:var(--muted);font-size:12.5px}
.cnums{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.cnum{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border-radius:10px;background:var(--surface-2)}
.cnum b{font-family:var(--f-brand);font-stretch:110%;font-weight:800;font-size:17px;font-variant-numeric:tabular-nums;line-height:1.1}
.cnum span{font-size:10.5px;color:var(--muted);text-align:center;line-height:1.2}
.cnum i{width:6px;height:6px;border-radius:50%}
.ct-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.ct-foot b{color:var(--fg);font-variant-numeric:tabular-nums}
.cp-hero{display:flex;gap:16px;align-items:center;padding:18px;border-radius:18px;background:var(--surface-2);border:1px solid var(--line);flex-wrap:wrap}
.cp-hero h2{font-family:var(--f-display);font-stretch:110%;font-weight:800;font-size:22px;overflow-wrap:anywhere}
.cp-hero .meta2{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.cstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cstat{border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;background:var(--surface);position:relative;overflow:hidden}
.cstat::after{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:3px;background:var(--c,var(--violet))}
.cstat b{font-family:var(--f-brand);font-stretch:112%;font-weight:800;font-size:24px;font-variant-numeric:tabular-nums;line-height:1.15}
.cstat span{font-size:12px;color:var(--fg-2)}
.cstat.money b{font-size:19px}
.mix{display:flex;height:12px;border-radius:8px;overflow:hidden;gap:2px;background:var(--surface-3)}
.mix span{display:block;height:100%}
.mixleg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--fg-2)}
.mixleg span{display:inline-flex;align-items:center;gap:6px}
.mixleg i{width:9px;height:9px;border-radius:3px;display:inline-block}
.wform{border:1px solid var(--line);border-radius:16px;padding:16px;background:var(--surface-2);display:flex;flex-direction:column;gap:14px}
.srow{display:grid;grid-template-columns:120px minmax(0,1fr) 48px;gap:12px;align-items:center}
.srow label{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.srow label i{width:9px;height:9px;border-radius:50%;flex:none}
.srow input[type="range"]{width:100%;accent-color:var(--c);height:28px;cursor:pointer}
.srow output{justify-self:end;min-width:44px;text-align:center;font-family:var(--f-brand);font-stretch:110%;font-weight:800;font-size:16px;padding:4px 0;border-radius:9px;background:var(--surface);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.srow output.on{color:#fff;background:var(--c);border-color:transparent}
.wentries{display:flex;flex-direction:column;gap:10px}
.wentry{display:grid;grid-template-columns:58px minmax(0,1fr);gap:14px;border:1px solid var(--line);border-radius:16px;padding:14px;background:var(--surface)}
.wdate{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:12px;background:var(--surface-2);padding:8px 4px;height:max-content}
.wdate b{font-family:var(--f-brand);font-stretch:110%;font-weight:800;font-size:22px;line-height:1}
.wdate span{font-size:11px;color:var(--muted);margin-top:3px;text-align:center}
.wbody{display:flex;flex-direction:column;gap:10px;min-width:0}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.cpill{display:inline-flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--fg)}
[dir="rtl"] .cpill{padding:6px 6px 6px 12px}
.cpill b{display:grid;place-items:center;min-width:28px;height:28px;padding:0 6px;border-radius:999px;background:var(--c);color:#fff;font-family:var(--f-brand);font-stretch:110%;font-weight:800;font-size:13.5px;font-variant-numeric:tabular-nums}
.cpill span{font-size:13px;font-weight:600}
.wmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.wmeta .end{margin-inline-start:auto}
.prow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.prow:first-child{border-top:0}
.prow b.amt{font-family:var(--f-brand);font-stretch:110%;font-weight:800;font-variant-numeric:tabular-nums;color:var(--good)}
.prow small{color:var(--muted);font-size:12px}
.inline-form{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.inline-form .full{grid-column:1/-1}

/* ---------- Tools & finance (premium) ---------- */
.fin-hero{--bg:#0B0D17;--surface:#121524;--surface-2:#181C2E;--surface-3:#20253B;--fg:#F4F2EE;--fg-2:#B4B2C8;--muted:#8A8BA6;--line:#272C45;--line-2:#343A58;--violet:#8B63F7;--coral:#F05A35;--good:#3DBE86;--bad:#FF5C7A;--tint-good:rgba(61,190,134,.15);--tint-bad:rgba(255,92,122,.15);
  color:var(--fg);border-radius:22px;padding:26px;border:1px solid #272C45;position:relative;overflow:hidden;
  background:radial-gradient(640px 320px at 88% -18%,rgba(139,99,247,.38),transparent 62%),radial-gradient(520px 260px at 6% 118%,rgba(240,90,53,.24),transparent 62%),linear-gradient(180deg,#10132A,#0B0D17)}
.fin-hero::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1.2px);background-size:20px 20px;pointer-events:none}
.fin-hero > *{position:relative}
.fh-top{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:flex-start}
.fh-net small{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
:root[lang="ar"] .fh-net small{letter-spacing:0}
.fh-net b{display:block;font-family:var(--f-brand);font-stretch:118%;font-weight:900;font-size:clamp(34px,6vw,52px);line-height:1.05;margin-top:8px;font-variant-numeric:tabular-nums;unicode-bidi:plaintext;text-align:start}
.fh-net b.neg{color:var(--bad)}
.fh-net span{display:inline-flex;margin-top:8px;font-size:12.5px;color:var(--fg-2)}
.fh-figs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:22px}
.fh-fig{padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(6px)}
.fh-fig small{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--fg-2)}
.fh-fig small i{width:8px;height:8px;border-radius:2px;display:inline-block}
.fh-fig b{display:block;font-family:var(--f-brand);font-stretch:112%;font-weight:800;font-size:21px;margin-top:6px;font-variant-numeric:tabular-nums}
.fh-fig em{font-style:normal;font-size:11.5px;color:var(--muted)}
.fh-chart{margin-top:20px}
.fh-chart .chart text{fill:var(--muted)}
.fh-chart .gl{stroke:rgba(255,255,255,.07)}
.fh-chart .base{stroke:rgba(255,255,255,.18)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(250px,100%),1fr));gap:14px}
.tool{position:relative;border:1px solid var(--line);border-radius:18px;padding:16px;background:var(--surface);display:flex;flex-direction:column;gap:12px;min-width:0}
.tool.expired{border-color:color-mix(in srgb,var(--bad) 60%,transparent);background:linear-gradient(180deg,var(--tint-bad),var(--surface) 70%)}
.tool.soon{border-color:color-mix(in srgb,var(--warn) 55%,transparent)}
.t-head{display:flex;gap:12px;align-items:center;min-width:0}
.tmono{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;flex:none;font-family:var(--f-brand);font-stretch:110%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.t-head b{display:block;font-size:14.5px;overflow-wrap:anywhere}
.t-head small{color:var(--muted);font-size:12px}
.spill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.spill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.spill.active{background:var(--tint-good);color:var(--good)}
.spill.soon{background:var(--tint-warn);color:var(--warn)}
.spill.expired{background:var(--bad);color:#fff}
.tbar{height:6px;border-radius:6px;background:var(--surface-3);overflow:hidden}
.tbar span{display:block;height:100%;border-radius:6px;background:var(--good)}
.tool.soon .tbar span{background:var(--warn)}
.tool.expired .tbar span{background:var(--bad);width:100%!important}
.t-row{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.t-row b{color:var(--fg);font-variant-numeric:tabular-nums}
.t-act{display:flex;gap:8px;flex-wrap:wrap}
.tpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(132px,100%),1fr));gap:8px}
.tpick label{display:flex;align-items:center;gap:9px;padding:9px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:13px;font-weight:600;min-width:0}
.tpick label span{overflow-wrap:anywhere}
.tpick input{position:absolute;opacity:0;pointer-events:none}
.tpick label:has(input:checked){border-color:var(--violet);background:var(--tint-violet)}
.tpick .tmono{width:30px;height:30px;border-radius:9px;font-size:11px}
.dur{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.dur label{text-align:center;padding:9px 4px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:13px}
.dur input{position:absolute;opacity:0;pointer-events:none}
.dur label:has(input:checked){border-color:var(--violet);background:var(--tint-violet);color:var(--fg)}
.until{font-size:13px;color:var(--fg-2);padding:10px 12px;border-radius:10px;background:var(--surface-2)}
.until b{color:var(--fg)}
.rev{display:flex;flex-direction:column;gap:12px}
.rev-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center}
.rev-row .nm{font-size:13.5px;font-weight:600;overflow-wrap:anywhere}
.rev-row .am{font-family:var(--f-brand);font-stretch:110%;font-weight:800;font-variant-numeric:tabular-nums;font-size:14px}
.rev-row .bar{grid-column:1/-1;height:8px;border-radius:6px;background:var(--surface-3);overflow:hidden}
.rev-row .bar span{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--violet),color-mix(in srgb,var(--violet) 60%,var(--coral)))}
.rev-row small{grid-column:1/-1;font-size:11.5px;color:var(--muted);margin-top:-2px}
.ftable td.amt{font-family:var(--f-brand);font-stretch:110%;font-weight:700;font-variant-numeric:tabular-nums;text-align:end}
.ftable th.amt{text-align:end}
.ftable td{vertical-align:middle}
.ftable .tcell{display:flex;align-items:center;gap:9px}
.ftable .tcell .tmono{width:26px;height:26px;border-radius:8px;font-size:10px}
.g2.fin{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
@media (max-width:1180px){.g2.fin{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .wk{grid-template-columns:minmax(0,1fr);justify-items:center}
  .wk-info{width:100%}
  .fh-figs{grid-template-columns:minmax(0,1fr)}
  .fin-hero{padding:20px;border-radius:18px}
  .cstats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .srow{grid-template-columns:96px minmax(0,1fr) 44px;gap:8px}
  .inline-form{grid-template-columns:minmax(0,1fr)}
  .cnums{grid-template-columns:repeat(5,minmax(0,1fr))}
}
@media (max-width:400px){.dur{grid-template-columns:repeat(2,minmax(0,1fr))}.cnum span{font-size:9.5px}}

/* ---------- Content library ---------- */
.ic.fill{fill:currentColor;stroke:none}
.chip.ct-image{background:var(--tint-info);color:var(--info)}
.chip.ct-reel{background:var(--tint-coral);color:var(--coral)}
.chip.ct-video{background:var(--tint-violet);color:var(--violet)}
.chip.for-client{background:var(--tint-good);color:var(--good)}
.chip.for-leads{background:var(--tint-warn);color:var(--warn)}
.chip.for-internal{background:var(--tint-teal);color:var(--teal)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(210px,100%),1fr));gap:16px}
.mcard{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:border-color .15s,transform .15s;min-width:0}
.mcard:hover{border-color:var(--line-2);transform:translateY(-2px)}
.mthumb{position:relative;aspect-ratio:4/5;background-color:var(--surface-2);background-image:radial-gradient(var(--dot) 1px,transparent 1.2px);background-size:16px 16px;display:grid;place-items:center;overflow:hidden}
.mthumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ochip{position:absolute;top:10px;inset-inline-start:10px;display:inline-flex;align-items:center;gap:6px;padding:3px 9px 3px 7px;border-radius:999px;background:rgba(8,9,16,.68);color:#fff;font-size:11.5px;font-weight:700;backdrop-filter:blur(6px)}
.ochip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.mthumb .mdur{position:absolute;bottom:10px;inset-inline-end:10px;background:rgba(8,9,16,.68);color:#fff;font-family:var(--f-mono);font-size:11px;padding:2px 7px;border-radius:6px;direction:ltr}
.playb{position:relative;width:48px;height:48px;border-radius:50%;background:rgba(8,9,16,.55);display:grid;place-items:center;color:#fff;backdrop-filter:blur(4px);box-shadow:0 0 0 1px rgba(255,255,255,.18)}
.playb .ic{width:20px;height:20px;margin-left:3px}
.fext{font-family:var(--f-brand);font-stretch:110%;font-weight:800;font-size:20px;color:var(--fg-2);padding:12px 14px;border:2px solid var(--line-2);border-radius:12px;text-transform:uppercase;direction:ltr;max-width:80%;overflow:hidden;text-overflow:ellipsis}
.mbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
.mbody h4{font-size:14px;font-weight:600;line-height:1.35;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mbody .chip{max-width:100%;overflow:hidden;text-overflow:ellipsis}
.mfoot{display:flex;align-items:center;gap:8px;margin-top:auto;font-size:12px;color:var(--muted);min-width:0}
.mfoot span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mfoot .iconbtn{width:32px;height:32px}
.cv{position:relative;border-radius:14px;overflow:hidden;background:#000;display:grid;place-items:center;min-height:120px}
.cv img,.cv video{display:block;max-width:100%;max-height:62vh;width:auto;height:auto}
.cv video{width:100%;background:#000}
.cv.file{background:var(--surface-2);padding:44px 20px}
.cv .nopv{display:none;color:#fff;padding:30px 20px;text-align:center;font-size:13.5px}
.cv.failed video{display:none}.cv.failed .nopv{display:block}
.finfo{display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px 16px;font-size:13px;margin:0}
.finfo dt{color:var(--muted)}.finfo dd{margin:0;overflow-wrap:anywhere}
.choice{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.choice label{position:relative;display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;min-width:0}
.choice input{position:absolute;opacity:0;pointer-events:none}
.choice label:has(input:checked){border-color:var(--violet);background:var(--tint-violet)}
.choice label:has(input:focus-visible){outline:2px solid var(--violet);outline-offset:2px}
.choice b{font-size:13.5px}.choice small{font-size:12px;color:var(--muted)}
.lpick{max-height:240px;overflow-y:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);overscroll-behavior:contain}
.lpick label{display:flex;gap:10px;align-items:center;padding:9px 12px;border-top:1px solid var(--line);cursor:pointer;font-size:13.5px}
.lpick label:first-child{border-top:0}
.lpick label span[dir]{flex:1;min-width:0;overflow-wrap:anywhere}
.lpick input{accent-color:var(--violet);width:18px;height:18px;flex:none}
.dz{display:flex;flex-direction:column;align-items:center;gap:6px;padding:26px 18px;border:2px dashed var(--line-2);border-radius:16px;background:var(--surface-2);color:var(--fg-2);text-align:center;cursor:pointer;transition:border-color .15s,background .15s}
.dz:hover,body.filedrag .dz{border-color:var(--violet);background:var(--tint-violet)}
.dz .ic{width:26px;height:26px;color:var(--violet)}
.dz b{color:var(--fg)}.dz small{font-size:12.5px;color:var(--muted)}
.pfiles{display:flex;flex-direction:column;gap:8px}
.pfile{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.pth{width:52px;height:52px;border-radius:9px;background:var(--surface-3);display:grid;place-items:center;overflow:hidden;color:var(--fg-2);font-size:10px;text-transform:uppercase}
.pth img{width:100%;height:100%;object-fit:cover}
.pfile b{display:block;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pfile small{color:var(--muted);font-size:12px}
.pfile .iconbtn{margin:0}
.cstrip{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px}
.cs-i{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;padding:0;color:var(--fg-2);font-size:10px;text-transform:uppercase}
.cs-i:hover{border-color:var(--line-2)}
.cs-i img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cs-i .cs-t{position:absolute;bottom:6px;inset-inline-start:6px;width:9px;height:9px;border-radius:50%;box-shadow:0 0 0 2px rgba(8,9,16,.6)}
.csum{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
#uptray{position:fixed;inset-inline-start:max(20px,env(safe-area-inset-left,0px));bottom:max(20px,env(safe-area-inset-bottom,0px));z-index:61;width:min(360px,calc(100vw - 32px))}
.upt{background:var(--surface-3);border:1px solid var(--line-2);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;max-height:50vh;overflow-y:auto}
.upt > b{font-size:13.5px}
.upj{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 10px;align-items:center;font-size:12.5px}
.upj .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg-2)}
.upj .st{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-variant-numeric:tabular-nums}
.upj .x{border:0;background:none;color:var(--muted);padding:2px;border-radius:6px;display:inline-grid}
.upj .x:hover{color:var(--bad)}.upj .x .ic{width:15px;height:15px}
.upj .bar{grid-column:1/-1;height:4px;border-radius:4px;background:var(--surface);overflow:hidden}
.upj .bar span{display:block;height:100%;background:var(--violet);border-radius:4px;transition:width .2s}
.upj.done .bar span{background:var(--good)}.upj.canceled .bar span{background:var(--muted)}.upj.error .bar span{background:var(--bad);width:100%!important}
.upj.done .st{color:var(--good)}.upj.error .st{color:var(--bad)}
.upj small{grid-column:1/-1;color:var(--bad);font-size:12px}
.qcap{margin-top:5px;font-size:12.5px;color:var(--fg-2);white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.qthumb{width:46px;height:46px;border-radius:9px;object-fit:cover;flex:none;background:var(--surface-2)}
.cv.zoomable{cursor:zoom-in}
.lstat{flex-wrap:wrap}
.lstat .txt b{font-weight:600}
.lstat .t-act{align-self:center}
#lightbox{position:fixed;inset:0;z-index:70;background:rgba(5,6,12,.94);display:flex;flex-direction:column;animation:fade .15s;color:#fff;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.lb-top{display:flex;align-items:center;gap:12px;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
.lb-top b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-top .mono{color:rgba(255,255,255,.6)}
.lb-top .btn,.lb-top .iconbtn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18);color:#fff;margin:0}
.lb-img{flex:1;min-height:0;display:grid;place-items:center;padding:0 12px 16px}
.lb-img img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:#fff;display:grid;place-items:center}
.lb-nav.prev{inset-inline-start:12px}.lb-nav.next{inset-inline-end:12px}
@media (max-width:860px){
  .mgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .mbody{padding:10px 11px 12px}
  .mbody h4{font-size:13.5px}
  .mfoot .av{display:none}
  .choice{grid-template-columns:minmax(0,1fr)}
  #uptray{top:calc(10px + env(safe-area-inset-top,0px));bottom:auto;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));width:auto}
}

/* ---------- Responsive ---------- */
@media (max-width:1180px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.g2,.g2.even{grid-template-columns:minmax(0,1fr)}}

  .side-foot{flex-direction:column;padding:8px}

  .main{padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
}

  .login{grid-template-columns:minmax(0,1fr)}
  .login-brand{border-inline-end:0;border-bottom:1px solid var(--line);padding-block:24px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));gap:20px}
  .login-brand .lb-foot{display:none}

/* ---------- PIN login ---------- */
async function hashPin(id, pin) {
  const data = new TextEncoder().encode("highmedia:" + id + ":" + pin);
  try { const b = await crypto.subtle.digest("SHA-256", data); return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, "0")).join(""); }
  catch (e) { let h = 5381; for (const c of data) h = ((h << 5) + h + c) | 0; return "d" + (h >>> 0).toString(16); }
}
function pinMode() {
  const m = S.members[S.login.member];
  if (!S.loaded.members) return "loading";
  if (m && m.pinHash) return "enter";
  return S.login.first ? "confirm" : "create";
}
function pinDigit(d) {
  const L = S.login; if (L.busy || L.pin.length >= 4 || pinMode() === "loading") return;
  L.pin += d; L.error = ""; L.shake = false; render();
  if (L.pin.length === 4) { L.busy = true; setTimeout(pinComplete, 140); }
}
async function pinComplete() {
  const L = S.login; const id = L.member; const mode = pinMode();
  try {
    if (mode === "enter") {
      const h = await hashPin(id, L.pin);
      if (h === S.members[id].pinHash) return signIn(id);
      L.error = "pinWrong"; L.shake = true;
    } else if (mode === "create") { L.first = L.pin; }
    else if (mode === "confirm") {
      if (L.pin !== L.first) { L.error = "pinMismatch"; L.first = ""; L.shake = true; }
      else {
        const h = await hashPin(id, L.pin);
        const ok = await guard(() => S.db.doc("members/" + id).set({ pinHash: h, pinSetAt: now() }));
        if (ok) { signIn(id); logAct("account", "pin_created", {}, null); return; }
        L.first = "";
      }
    }
  } finally { L.pin = ""; L.busy = false; render(); }
}
function signIn(id) {
  S.me = id; S.loginAt = now(); S.seenAt = store.get("seen." + id) || 0;
  store.set("session", { id, at: now() });
  S.login = { member: null, pin: "", first: "", error: "", busy: false, shake: false, forgot: false };

/* ---------- Chart ---------- */
function weekStarts(n) {
  const s = new Date(); s.setHours(0, 0, 0, 0); s.setDate(s.getDate() - s.getDay());
  const out = []; for (let i = n - 1; i >= 0; i--) { const d = new Date(s); d.setDate(s.getDate() - 7 * i); out.push(d.getTime()); }
  return out;
}
function completionEvents(mode) {
  const ev = [];
  if (mode === "tasks") S.tasks.forEach(x => { if (x.status === "done" && x.completedBy && x.completedAt) ev.push({ by: x.completedBy, at: x.completedAt }); });
  else S.tasks.forEach(x => (x.checklist || []).forEach(c => { if (c.done && c.doneBy && c.doneAt) ev.push({ by: c.doneBy, at: c.doneAt }); }));
  return ev;
}
function niceTop(max) { if (max <= 4) return { top: 4, step: 1 }; for (const s of [2, 5, 10, 20, 25, 50, 100, 200]) if (Math.ceil(max / s) <= 4) return { top: Math.ceil(max / s) * s, step: s }; return { top: max, step: max }; }
function barPath(x, y, w, h) { const r = Math.min(4, w / 2, h); return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`; }
let chartRows = [];
function chartHTML() {
  const mode = S.chartMode; const starts = weekStarts(8); const end = starts[starts.length - 1] + 7 * DAY;
  const rows = starts.map(s => ({ s, faisal: 0, abdulrahman: 0 }));
  const evs = completionEvents(mode);
  evs.forEach(e => { if (e.at < starts[0] || e.at >= end) return; let i = starts.length - 1; while (i > 0 && e.at < starts[i]) i--; if (rows[i][e.by] != null) rows[i][e.by]++; });
  chartRows = rows;
  const tot = { faisal: rows.reduce((a, r) => a + r.faisal, 0), abdulrahman: rows.reduce((a, r) => a + r.abdulrahman, 0) };
  const all = tot.faisal + tot.abdulrahman;
  const W = 600, H = 210, ml = 26, mr = 6, mt = 10, mb = 26, pw = W - ml - mr, phh = H - mt - mb;
  const { top, step } = niceTop(Math.max(...rows.map(r => Math.max(r.faisal, r.abdulrahman))));
  const y = v => mt + phh - (v / top) * phh; const gw = pw / rows.length; const bw = Math.min(18, gw * .3);
  let g = "";
  for (let v = 0; v <= top; v += step) g += `<line class="${v === 0 ? "base" : "gl"}" x1="${ml}" x2="${W - mr}" y1="${y(v)}" y2="${y(v)}"/><text x="${ml - 8}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  rows.forEach((r, i) => {
    const cx = ml + gw * i + gw / 2;
    g += `<rect class="hit" data-i="${i}" x="${ml + gw * i + 2}" y="${mt}" width="${gw - 4}" height="${phh}" rx="6"/>`;
    [["faisal", cx - bw - 1], ["abdulrahman", cx + 1]].forEach(([k, x]) => { if (r[k] > 0) g += `<path d="${barPath(x, y(r[k]), bw, y(0) - y(r[k]))}" fill="${k === "faisal" ? "var(--c-faisal)" : "var(--c-abd)"}" pointer-events="none"/>`; });
    g += `<text x="${cx}" y="${H - 8}" text-anchor="middle">${esc(fmtDM(r.s))}</text>`;
  });
  const n0 = new Date();
  const thisMonth = evs.filter(e => { const d = new Date(e.at); return d.getMonth() === n0.getMonth() && d.getFullYear() === n0.getFullYear(); });
  const mf = thisMonth.filter(e => e.by === "faisal").length, ma = thisMonth.filter(e => e.by === "abdulrahman").length;
  const noun = t(mode === "tasks" ? "nounTasks" : "nounSteps");
  return `<div class="card-h"><div><h2>${t("chartTitle")}</h2><p>${t("chartSub", { noun })}</p></div>
    <div class="seg" role="group"><button class="${mode === "tasks" ? "on" : ""}" data-action="chart-mode" data-m="tasks">${t("segTasks")}</button><button class="${mode === "steps" ? "on" : ""}" data-action="chart-mode" data-m="steps">${t("segSteps")}</button></div></div>
    <div class="legend"><span><i style="background:var(--c-faisal)"></i>${mName("faisal")} <b>${tot.faisal}</b></span><span><i style="background:var(--c-abd)"></i>${mName("abdulrahman")} <b>${tot.abdulrahman}</b></span></div>
    ${all === 0 ? `<div class="empty" style="padding:30px 10px"><b>${t("noneDone", { noun })}</b><span>${t("noneDoneSub")}</span></div>` :
    `<div class="chart" id="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t("chartAria", { noun }))}">${g}</svg><div class="tip" id="tip" hidden></div></div>`}

/* ---------- Weekly target ---------- */
function weekCard() {
  const w = weekInfo(); const pct = Math.round(w.n / w.target * 100); const shown = Math.min(100, pct);
  const R = 52, C = 2 * Math.PI * R; const color = pct >= 100 ? "var(--good)" : "var(--violet)";
  const pace = pct >= 100 ? `<span class="pace good">${ic("check")} ${t("wkReached")}</span>` : w.diff >= 0 ? `<span class="pace good">${w.diff > 0 ? t("wkAhead", { n: w.diff }) : t("wkOnPace")}</span>` : `<span class="pace warn">${t("wkBehind", { n: -w.diff })}</span>`;
  const max = Math.max(1, ...w.perDay);
  const days = w.perDay.map((n, i) => { const d = new Date(w.ws + i * DAY + 12 * 3600e3); return `<div class="${i === w.dayIdx ? "today" : ""}" title="${esc(fmtD(d.getTime()))}: ${n}"><i class="${n ? "" : "zero"}" style="height:${n ? Math.max(8, n / max * 100) : 6}%"></i><span>${WEEKDAYS[LANG][d.getDay()].slice(0, LANG === "ar" ? 3 : 2)}</span></div>`; }).join("");
  const split = w.n ? `<div class="split" style="direction:ltr;margin-top:0"><span style="width:${w.by.faisal / w.n * 100}%;background:var(--c-faisal)"></span><span style="flex:1;background:var(--c-abd)"></span></div>` : `<div class="split" style="margin-top:0"></div>`;
  const edit = S.editTarget ? `<form class="wk-edit" data-form="target"><label class="lbl" for="wk-target">${t("wkTargetLbl")}</label><input class="inp" id="wk-target" name="target" type="number" min="1" max="1000" inputmode="numeric" value="${w.target}"><button class="btn sm primary" type="submit">${t("save")}</button><button class="btn sm ghost" type="button" data-action="wk-cancel">${t("cancelBtn")}</button></form>` : "";
  return `<section class="card"><div class="wk">
    <div class="ring" role="img" aria-label="${pct}%"><svg viewBox="0 0 120 120"><circle class="trk" cx="60" cy="60" r="${R}"/><circle class="val" cx="60" cy="60" r="${R}" stroke="${color}" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - shown / 100)}"/></svg><div class="lbl"><b>${pct}%</b><small>${w.n} / ${w.target}</small></div></div>
    <div class="wk-info">
      <div class="wk-top"><div><h2>${t("wkTitle")}</h2><p>${t("wkSub", { done: w.n, target: w.target })} · ${w.daysLeft > 1 ? t("wkDaysLeft", { n: w.daysLeft }) : w.daysLeft === 1 ? t("wkDayLeft1") : t("wkLastDay")}</p></div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${pace}${S.editTarget ? "" : `<button class="btn sm ghost" data-action="wk-edit">${t("wkEdit")}</button>`}</div></div>
      ${edit}
      <div class="days7" style="direction:ltr">${days}</div>
      <div class="legend" style="margin:0;justify-content:space-between"><span><i style="background:var(--c-faisal)"></i>${mName("faisal")} <b>${w.by.faisal}</b></span><span><i style="background:var(--c-abd)"></i>${mName("abdulrahman")} <b>${w.by.abdulrahman}</b></span></div>
      ${split}
    </div></div></section>`;
}

/* ---------- Tools & finance ---------- */
function monthKey(ms) { const d = new Date(ms); return d.getFullYear() * 12 + d.getMonth(); }
function finChart() {
  const nowD = new Date(); const months = []; for (let i = 5; i >= 0; i--) { const d = new Date(nowD.getFullYear(), nowD.getMonth() - i, 1); months.push({ k: d.getFullYear() * 12 + d.getMonth(), label: MONTHS[LANG][d.getMonth()], rev: 0, spend: 0 }); }
  S.payments.forEach(p => { const m = months.find(x => x.k === monthKey(dateMs(p.date))); if (m) m.rev += toNum(p.amount); });
  S.subs.forEach(s => { const m = months.find(x => x.k === monthKey(dateMs(s.start))); if (m) m.spend += toNum(s.amount); });
  const W = 600, H = 190, ml = 44, mr = 6, mt = 10, mb = 26, pw = W - ml - mr, phh = H - mt - mb;
  const maxV = Math.max(...months.map(m => Math.max(m.rev, m.spend))); if (!maxV) return "";
  const raw = maxV / 4; const mag = Math.pow(10, Math.floor(Math.log10(raw))); const step = [1, 2, 2.5, 5, 10].map(x => x * mag).find(x => x >= raw); const top = Math.ceil(maxV / step) * step;
  const y = v => mt + phh - (v / top) * phh; const gw = pw / months.length; const bw = Math.min(22, gw * .3);
  let g = "";
  for (let v = 0; v <= top + 1e-9; v += step) g += `<line class="${v === 0 ? "base" : "gl"}" x1="${ml}" x2="${W - mr}" y1="${y(v)}" y2="${y(v)}"/><text x="${ml - 8}" y="${y(v) + 4}" text-anchor="end">${Math.round(v).toLocaleString("en-US")}</text>`;
  months.forEach((m, i) => { const cx = ml + gw * i + gw / 2;
    g += `<g><title>${esc(m.label)} · ${esc(t("revLegend"))}: ${esc(money(m.rev))} · ${esc(t("spendLegend"))}: ${esc(money(m.spend))}</title><rect x="${ml + gw * i + 2}" y="${mt}" width="${gw - 4}" height="${phh}" fill="transparent"/>`;
    if (m.rev > 0) g += `<path d="${barPath(cx - bw - 1, y(m.rev), bw, y(0) - y(m.rev))}" fill="var(--violet)"/>`;
    if (m.spend > 0) g += `<path d="${barPath(cx + 1, y(m.spend), bw, y(0) - y(m.spend))}" fill="var(--coral)"/>`;
    g += `</g><text x="${cx}" y="${H - 8}" text-anchor="middle">${esc(m.label)}</text>`; });
  return `<div class="fh-chart"><div class="legend"><span><i style="background:var(--violet)"></i>${t("revLegend")}</span><span><i style="background:var(--coral)"></i>${t("spendLegend")}</span><span style="color:var(--muted)">${t("fin6")}</span></div>
    <div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t("fin6"))}">${g}</svg></div>
    <details class="tbl"><summary>${t("viewTable")}</summary><div class="tablewrap"><table><thead><tr><th></th><th class="n">${t("revLegend")}</th><th class="n">${t("spendLegend")}</th></tr></thead><tbody>${months.slice().reverse().map(m => `<tr><td>${esc(m.label)}</td><td class="n">${money(m.rev)}</td><td class="n">${money(m.spend)}</td></tr>`).join("")}</tbody></table></div></details></div>`;
}

/* ---------- Content library (files in Firebase Storage, details in Firestore "content") ---------- */
const CTYPES = ["image","reel","video","file"];
const CT2_COLOR = { image: "var(--info)", reel: "var(--coral)", video: "var(--violet)", file: "var(--muted)" };
const MAX_UP = 500 * 1024 * 1024;
/* Lossless compression: gzip on this device before upload, gunzip back to the exact original on download.

const gzipBlob = b => new Response(b.stream().pipeThrough(new CompressionStream("gzip"))).blob();

async function packFile(f) {

    const z = await gzipBlob(f); return z.size <= f.size * 0.85 ? z : null;
  } catch (e) { return null; }
}
async function unpackIfNeeded(c, b) {
  if (!c.compressed || typeof DecompressionStream === "undefined") return b;
  const h = new Uint8Array(await b.slice(0, 2).arrayBuffer());
  return h[0] === 0x1f && h[1] === 0x8b ? gunzipBlob(b) : b; // the server may already have decompressed it
}
const ctypeL = k => t("ct2_" + (CTYPES.includes(k) ? k : "file"));
const isVid = c => c.type === "reel" || c.type === "video";
const findContent = id => S.content.find(x => x.id === id);
const COMPANY = "_company"; // content for our own company (HIGH MEDIA's own pages)
// Who a file belongs to, by its current purpose (fields from an earlier purpose are kept so switching back restores them, but don't count).
const linkedIds = c => c.purpose === "client" ? (c.clientId ? [c.clientId] : []) : c.audience === "internal" ? [] : (c.leadIds || []);
const contentFor = id => S.content.filter(c => linkedIds(c).includes(id));
const extOf = n => { const m = /\.([a-z0-9]{1,6})$/i.exec(String(n || "")); return m ? m[1] : ""; };
const stemOf = n => String(n || "").replace(/\.[a-z0-9]{1,6}$/i, "").replace(/[_]+/g, " ").trim() || String(n || "");
function fmtSize(b) { b = +b || 0; const u = ["B","KB","MB","GB"]; let i = 0; while (b >= 1024 && i < 3) { b /= 1024; i++; } return "\u2066" + (i ? b.toFixed(b < 10 ? 1 : 0) : Math.round(b)) + " " + u[i] + "\u2069"; }
function fmtDur(s) { s = Math.round(+s || 0); return Math.floor(s / 60) + ":" + pad(s % 60); }

  if (c.purpose === "client") { if (c.clientId === COMPANY) return { cls: "for-internal", text: t("ourCompanyShort") }; const l = findLead(c.clientId); return { cls: "for-client", text: l ? leadName(l) : (c.clientName || t("noClient")) }; }
  if (c.audience === "internal") return { cls: "for-internal", text: t("demoInternal") };
  const ids = (c.leadIds || []).filter(findLead);
  return { cls: "for-leads", text: ids.length === 1 ? t("demoFor", { name: leadName(findLead(ids[0])) }) : ids.length ? t("demoForN", { n: ids.length }) : t("demoAnyLead") };
}
function destParams(d) {

  if (d.audience === "internal") return { dest: "internal" };
  const ids = d.leadIds || [];
  return ids.length === 1 ? { dest: "leads1", name: leadName(findLead(ids[0])) } : ids.length ? { dest: "leadsN", n: ids.length } : { dest: "leadsAny" };
}
function detectType(f, info) {
  const k = (info && info.kind) || ((f.type || "").startsWith("image/") ? "image" : (f.type || "").startsWith("video/") ? "video" : "file");
  if (k === "image") return "image";
  if (k === "video") return info && info.w && info.h && info.w >= info.h ? "video" : "reel";

}
function safeName(n) { const e = extOf(n); const b = String(n || "file").normalize("NFKD").replace(/\.[^.]*$/, "").replace(/[^\w.-]+/g, "_").replace(/^_+|_+$/g, "").slice(0, 60) || "file"; return b + (e ? "." + e.toLowerCase() : ""); }

  const c = String((e && e.code) || ""); const msg = String((e && e.message) || "");
  if (c.includes("unauthorized") || c.includes("permission")) return t("eStUnauthorized");
  if (c.includes("bucket-not-found") || c.includes("project-not-found") || (c.includes("unknown") && /404|not found/i.test(msg))) return t("eStMissing");

/* Reads size, length and a small JPEG preview from a file, on the device, before it's uploaded */
function waitEv(el, ev, ms) {
  return new Promise((res, rej) => {
    const tm = setTimeout(() => rej(new Error("timeout")), ms);
    el.addEventListener(ev, () => { clearTimeout(tm); res(); }, { once: true });
    el.addEventListener("error", () => { clearTimeout(tm); rej(new Error("media")); }, { once: true });
  });
}
function thumbBlob(src, w, h) {
  return new Promise(res => {
    if (!w || !h) return res(null);
    const k = Math.min(1, 640 / Math.max(w, h)); const c = document.createElement("canvas");
    c.width = Math.max(1, Math.round(w * k)); c.height = Math.max(1, Math.round(h * k));
    try { const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(src, 0, 0, c.width, c.height); c.toBlob(b => res(b), "image/jpeg", .82); }
    catch (e) { res(null); }
  });
}
async function mediaInfo(f) {
  const mt = f.type || ""; const kind = mt.startsWith("image/") ? "image" : mt.startsWith("video/") ? "video" : "file";
  if (kind === "file") return { kind };
  const url = URL.createObjectURL(f);
  try {
    if (kind === "image") {
      const i = new Image(); const p = waitEv(i, "load", 15000); i.src = url; await p;
      return { kind, w: i.naturalWidth, h: i.naturalHeight, thumb: await thumbBlob(i, i.naturalWidth, i.naturalHeight) };
    }
    const v = document.createElement("video"); v.muted = true; v.playsInline = true; v.preload = "auto";
    const p = waitEv(v, "loadedmetadata", 15000); v.src = url; await p;
    const info = { kind, w: v.videoWidth, h: v.videoHeight, dur: isFinite(v.duration) ? v.duration : 0 };
    try {
      if (v.readyState < 2) await waitEv(v, "loadeddata", 5000);
      const s = waitEv(v, "seeked", 5000); v.currentTime = info.dur ? Math.min(1, info.dur / 3) : 0.1; await s;
      info.thumb = await thumbBlob(v, info.w, info.h);
    } catch (e) {}
    return info;
  } catch (e) { return { kind }; }
  finally { URL.revokeObjectURL(url); }
}

/* Upload queue: one file at a time, progress shown in the tray */
const upActive = j => j.state === "queued" || j.state === "packing" || j.state === "uploading" || j.state === "saving";
function renderTray() {
  const el = $("#uptray"); if (!el) return;
  const js = S.uploads; if (!js.length) { el.innerHTML = ""; el.hidden = true; return; }
  const active = js.filter(upActive).length; el.hidden = false;
  el.innerHTML = `<div class="upt" role="status"><b>${active ? t("uploadingN", { n: active }) : t("upFinished")}</b>${js.map(j => {
    const pct = Math.round((j.pct || 0) * 100);
    const st = j.state === "uploading" ? pct + "%" : t({ queued: "upQueued", packing: "upPacking", saving: "upSaving", done: "upDone", canceled: "upCanceled" }[j.state] || "upFailed");
    const btn = j.state === "queued" || j.state === "packing" || j.state === "uploading" ? `<button class="x" data-action="up-cancel" data-key="${j.key}" aria-label="${t("cancelUpload")}">${ic("x")}</button>`
      : j.state === "error" ? `<button class="x" data-action="up-dismiss" data-key="${j.key}" aria-label="${t("dismiss")}">${ic("x")}</button>` : "";
    return `<div class="upj ${j.state}"><span class="nm" dir="auto">${esc(j.file.name)}</span><span class="st"><span id="ups-${j.key}">${st}</span>${btn}</span><span class="bar"><span id="upb-${j.key}" style="width:${j.state === "done" ? 100 : pct}%"></span></span>${j.err ? `<small>${j.err}</small>` : j.hint ? `<small style="color:var(--muted)">${j.hint}</small>` : ""}</div>`;
  }).join("")}</div>`;
}
function trayProgress(j) {
  const pct = Math.round((j.pct || 0) * 100);
  const b = document.getElementById("upb-" + j.key), s = document.getElementById("ups-" + j.key);
  if (b) b.style.width = pct + "%"; if (s) s.textContent = pct + "%";
}
async function runUpload(job) {

  const path = base + safeName(f.name);

  const z = await packFile(f); const body = z || f;
  const meta = { contentType: f.type || "application/octet-stream", contentDisposition: dispo(f.name), customMetadata: { uploadedBy: S.me } };
  if (z) { meta.contentEncoding = "gzip"; meta.customMetadata.compressed = "gzip"; meta.customMetadata.originalSize = String(f.size); }
  if (job.state === "canceled") throw { code: "storage/canceled" };

    catch (e) { thumbPath = ""; thumbUrl = ""; }
  }

  const cname = c.purpose === "client" && c.clientId === COMPANY ? "HIGH MEDIA" : lead ? leadName(lead) : "";
  const doc = {
    title: job.title, note: c.note || "", type: job.type, purpose: c.purpose,
    clientId: c.purpose === "client" ? c.clientId : "", clientName: cname,
    audience: c.purpose === "demo" ? c.audience : "", leadIds: c.purpose === "demo" && c.audience === "leads" ? c.leadIds.slice() : [],
    postDate: c.purpose === "client" ? (c.postDate || "") : "", postTime: c.purpose === "client" && c.postDate ? (c.postTime || "") : "",
    caption: c.purpose === "client" ? (c.caption || "") : "", postedAt: null, postedBy: null,
    fileName: f.name, mime: f.type || "", size: f.size, storedSize: body.size, compressed: !!z, path, url, thumbPath, thumbUrl,
    w: info.w || 0, h: info.h || 0, dur: info.dur ? Math.round(info.dur * 10) / 10 : 0,

  catch (e) { st.ref(path).delete().catch(() => {}); if (thumbPath) st.ref(thumbPath).delete().catch(() => {}); throw e; }

let stReady = null, stCheckP = null;
function storageCheck() {
  if (stReady === true) return Promise.resolve(true);
  if (stCheckP) return stCheckP;
  stCheckP = S.storage.ref("content/_check/_none").getMetadata().then(() => true, e => {
    const c = String((e && e.code) || "");
    if (c.includes("object-not-found")) return true;          // reachable and allowed: the bucket answered
    throw (c.includes("unauthorized") ? e : { code: "storage/not-ready" });
  }).then(v => { stReady = true; S.stIssue = ""; return v; }, e => { stReady = false; S.stIssue = String(e.code || "").includes("unauthorized") ? t("eStUnauthorized") : t("stNotReady"); throw e; })
    .finally(() => { stCheckP = null; schedule(); if (S.drawer && S.drawer.type === "upload") renderUpload(); });
  return stCheckP;

let pumping = false;
async function pumpUploads() {
  if (pumping) return; pumping = true; let ok = 0;
  try {
    try { await storageCheck(); }
    catch (e) { S.uploads.filter(j => j.state === "queued").forEach(j => { j.state = "error"; j.err = S.stIssue; }); renderTray(); return; }
    for (;;) {
      const job = S.uploads.find(j => j.state === "queued"); if (!job) break;
      try { await runUpload(job); job.state = "done"; job.pct = 1; ok++; }
      catch (e) {
        if (job.state !== "canceled") {
          job.state = "error";
          job.err = e && e.code && !String(e.code).startsWith("storage/") ? (e.code === "permission-denied" ? t("eNoPermission") : t("eSave")) : stErr(e);
        }
      }
      renderTray();
    }
  } finally { pumping = false; }
  if (ok) toast(t("upAllDone", { n: ok }), "good");
  setTimeout(() => { S.uploads = S.uploads.filter(j => j.state !== "done" && j.state !== "canceled"); renderTray(); }, 4000);
}
window.addEventListener("beforeunload", e => { if (S.uploads.some(upActive)) { e.preventDefault(); e.returnValue = ""; } });

/* Upload form state (kept outside the DOM so chosen files survive re-renders) */
function freeUp() { if (S.up) S.up.files.forEach(x => { if (x.prev) URL.revokeObjectURL(x.prev); }); S.up = null; }
