  if (!S.storage) { toast(S.mode === "firebase" ? t("eStLoad") : t("storageOnlyFb"), "bad"); return; }
  freeUp(); pre = pre || {};
  const l = findLead(pre.client || pre.lead);
  const asClient = !!(l && (pre.client || l.stage === "client"));
  S.up = { files: [], purpose: l ? (asClient ? "client" : "demo") : "client", clientId: asClient ? l.id : "", audience: "leads", leadIds: l && !asClient ? [l.id] : [], type: "auto", title: "", note: "", postDate: "", postTime: "", caption: "" };
  openDrawer("upload");
  storageCheck().catch(() => {});
}
function renderUpload(focusId) {
  if (!S.drawer || S.drawer.type !== "upload") return;
  renderDrawer(false);
  if (focusId) { const n = document.getElementById(focusId); if (n) n.focus({ preventScroll: true }); }
}
function addPicked(list) {
  const U = S.up; if (!U) return;
  Array.from(list || []).forEach(f => {
    if (U.files.some(x => x.f.name === f.name && x.f.size === f.size && x.f.lastModified === f.lastModified)) return;
    const x = { f, info: null, prev: "" }; U.files.push(x);
    x.pending = mediaInfo(f).then(info => { x.info = info; if (info.thumb && S.up === U) x.prev = URL.createObjectURL(info.thumb); if (S.up === U) renderUpload(); });
  });

}

  const U = S.up; if (!U) return;

  if (U.purpose === "client" && !U.clientId) { toast(t("needClientC"), "bad"); return; }
  if (stReady === false) { try { await storageCheck(); } catch (e) { toast(S.stIssue, "bad"); return; } }

  const common = { purpose: U.purpose, clientId: U.clientId, audience: U.audience, leadIds: U.leadIds.slice(), note: U.note.trim(), postDate: U.postDate, postTime: U.postTime, caption: U.caption.trim() };
  const one = U.files.length === 1;
  U.files.forEach(x => S.uploads.push({
    key: uid(), file: x.f, info: x.info || { kind: "file" }, common, pct: 0, state: "queued",
    type: U.type === "auto" ? detectType(x.f, x.info) : U.type, title: (one && U.title.trim()) || stemOf(x.f.name)

}

  const ok = await guard(() => S.db.doc("content/" + id).update(Object.assign({}, patch, { updatedAt: now() })));
  if (ok) logAct("content", "content_updated", { title }, id);
  return ok;

async function deleteContent(id) {

  if (S.storage) {
    for (const p of [c.path, c.thumbPath].filter(Boolean)) {

/* Calendar export: a reminder on the device's own calendar, even with the portal closed */
const icsEsc = s => String(s || "").replace(/\\/g, "\\\\").replace(/\r?\n/g, "\\n").replace(/([,;])/g, "\\$1");
function icsFold(line) { const enc = new TextEncoder(); const out = []; let cur = ""; for (const ch of line) { if (enc.encode(cur + ch).length > 73) { out.push(cur); cur = " " + ch; } else cur += ch; } out.push(cur); return out.join("\r\n"); }
function calInfo(c) {
  const sum = t("calSummary", { name: clientOf(c), type: ctypeL(c.type), title: c.title });
  const desc = [t("calWhat") + ": " + c.title + " (" + ctypeL(c.type) + ")", c.caption ? t("caption") + ":\n" + c.caption : "", c.url ? t("calFile") + ": " + c.url : "", t("calPortal") + ": " + portalUrl()].filter(Boolean).join("\n\n");
  return { sum, desc };
}
function calTimes(c) {
  const d = c.postDate.replace(/-/g, "");
  if (!c.postTime) return { allDay: true, s: d, e: ymd(new Date(dateMs(c.postDate) + DAY)).replace(/-/g, "") };
  const [h, m] = c.postTime.split(":"); const e = new Date(dateMs(c.postDate)); e.setHours(+h, +m + 30, 0, 0);
  return { allDay: false, s: `${d}T${h}${m}00`, e: `${ymd(e).replace(/-/g, "")}T${pad(e.getHours())}${pad(e.getMinutes())}00` };
}
function icsFor(c) {
  const { sum, desc } = calInfo(c); const tm = calTimes(c);
  const stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+/, "");
  return ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//HIGH MEDIA//Portal//EN", "CALSCALE:GREGORIAN", "METHOD:PUBLISH", "BEGIN:VEVENT",
    `UID:${c.id}-${tm.s}@highmedia-portal`, `DTSTAMP:${stamp}`,
    tm.allDay ? `DTSTART;VALUE=DATE:${tm.s}` : `DTSTART:${tm.s}`, tm.allDay ? `DTEND;VALUE=DATE:${tm.e}` : `DTEND:${tm.e}`,
    "SUMMARY:" + icsEsc(sum), "DESCRIPTION:" + icsEsc(desc), "BEGIN:VALARM", "ACTION:DISPLAY", "DESCRIPTION:" + icsEsc(sum),
    tm.allDay ? "TRIGGER:PT9H" : "TRIGGER:-PT0M", "END:VALARM", "END:VEVENT", "END:VCALENDAR"].map(icsFold).join("\r\n") + "\r\n";
}
function saveBlob(blob, name) { const u = URL.createObjectURL(blob); const a = document.createElement("a"); a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 60000); }
function downloadIcs(c) { saveBlob(new Blob([icsFor(c)], { type: "text/calendar;charset=utf-8" }), safeName("post " + clientOf(c) + " " + c.postDate).replace(/\.[^.]*$/, "") + ".ics"); }

  const { sum, desc } = calInfo(c); const tm = calTimes(c); let tz = ""; try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch (e) {}
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text=" + encodeURIComponent(sum) + "&dates=" + tm.s + "/" + tm.e + "&details=" + encodeURIComponent(desc) + (tz && !tm.allDay ? "&ctz=" + encodeURIComponent(tz) : "");
}

/* Download with the original file name, or share / save to Photos on phones */
const blobCache = new Map();
function directDownload(c) { const a = document.createElement("a"); a.href = c.url; a.download = c.fileName || ""; a.target = "_blank"; a.rel = "noopener"; document.body.appendChild(a); a.click(); a.remove(); }
async function fetchFile(c) {
  if (blobCache.has(c.id)) return blobCache.get(c.id);
  const r = await fetch(c.url, { mode: "cors" }); if (!r.ok) throw new Error("HTTP " + r.status);
  const b = await unpackIfNeeded(c, await r.blob()); const f = new File([b], c.fileName || "file", { type: c.mime || b.type || "application/octet-stream" });
  blobCache.clear(); blobCache.set(c.id, f); return f;
}
async function downloadContent(c, share) {
  if (!c || !c.url) return;
  // Very large files go straight to the browser's own download (the file is served with its original name).
  if (!share && !c.compressed && (+c.size || 0) > 150 * 1024 * 1024) return directDownload(c);
  let f; try { f = await fetchFile(c); } catch (e) { return directDownload(c); }
  if (share && navigator.canShare && navigator.canShare({ files: [f] })) {
    try { await navigator.share({ files: [f], title: c.title }); }
    catch (e) { if (e && e.name === "NotAllowedError") toast(t("shareTapAgain")); }
    return;
  }
  saveBlob(f, f.name);
}

/* ---------- Drawer ---------- */
const FORM_DRAWERS = ["new-task","new-lead","project","sub","payment","upload"];
function openDrawer(type, id, extra) {
  if (S.drawer && S.drawer.type === "upload" && type !== "upload") freeUp();
  if (S.notesUnsub && !(type === "lead" && id === S.notesFor)) { S.notesUnsub(); S.notesUnsub = null; S.notes = []; S.notesFor = null; }
  S.drawer = { type, id, extra: extra || {} }; S.confirm = null;
  if (type === "lead" && S.db && S.notesFor !== id) {
    S.notesFor = id; S.notes = []; S.notesLoaded = false;
    S.notesUnsub = S.db.collection("leads/" + id + "/notes").orderBy("at", "desc").onSnapshot(snap => { S.notes = snap.docs.map(d => Object.assign({ id: d.id }, d.data())); S.notesLoaded = true; schedule(); }, () => { S.notesLoaded = true; schedule(); });
  }
  renderDrawer(true);
}
function closeDrawer(silent) {
  if (S.notesUnsub) { S.notesUnsub(); S.notesUnsub = null; } S.notesFor = null; S.notes = [];
  if (S.drawer && S.drawer.type === "upload") freeUp();
  S.drawer = null; S.confirm = null; $("#drawer-root").innerHTML = ""; document.body.style.overflow = ""; if (!silent) schedule();
}
function renderDrawer(fresh) {
  const root = $("#drawer-root"); const D = S.drawer;
  if (!D || !S.me) { root.innerHTML = ""; document.body.style.overflow = ""; return; }
  let head = "", body = "";
  if (D.type === "task") { const x = findTask(D.id); if (!x) { if (D.seen) closeDrawer(); return; } D.seen = true; [head, body] = taskDrawer(x); }
  else if (D.type === "lead") { const l = findLead(D.id); if (!l) { if (D.seen) closeDrawer(); return; } D.seen = true; [head, body] = leadDrawer(l); }
  else if (D.type === "new-task") [head, body] = newTaskForm();
  else if (D.type === "new-lead") [head, body] = newLeadForm();
  else if (D.type === "project") [head, body] = projectForm(D.id ? findProj(D.id) : null);
  else if (D.type === "client") { const l = findLead(D.id); if (!l) { if (D.seen) closeDrawer(); return; } D.seen = true; [head, body] = clientDrawer(l); }
  else if (D.type === "sub") [head, body] = subForm();
  else if (D.type === "payment") [head, body] = paymentForm();
  else if (D.type === "content") { const c = findContent(D.id); if (!c) { if (D.seen) closeDrawer(); return; } D.seen = true; [head, body] = contentDrawer(c); }
  else if (D.type === "upload") { if (!S.up) { closeDrawer(); return; } [head, body] = uploadForm(); }
  const prevBody = $(".d-body", root); const sc = prevBody ? prevBody.scrollTop : 0;
  // Keep a playing video alive across live re-renders: move the same element into the new markup.
  const keepV = root.querySelector("video[data-keep]");
  const anim = fresh ? " anim" : ""; // slide in only when the drawer opens, not on every refresh
  root.innerHTML = `<div class="scrim${anim}" data-action="close"></div><aside class="drawer${anim}" role="dialog" aria-modal="true"><div class="d-head">${head}<button class="iconbtn" data-action="close" aria-label="${t("close")}">${ic("x")}</button></div><div class="d-body">${body}</div></aside>`;
  if (keepV) { const nv = root.querySelector(`video[data-keep="${keepV.dataset.keep}"]`); if (nv) { nv.replaceWith(keepV); if (keepV.error) keepV.closest(".cv").classList.add("failed"); } }
  document.body.style.overflow = "hidden";
  const nb = $(".d-body", root); if (nb && !fresh) nb.scrollTop = sc;
  if (fresh && window.matchMedia("(min-width: 861px)").matches) { const first = $("[data-autofocus]", root); if (first) first.focus(); }
  root.querySelectorAll("textarea.title-in").forEach(autoGrow);
}

const prOptions = sel => ["low","normal","high"].map(k => `<option value="${k}" ${(sel || "normal") === k ? "selected" : ""}>${prL(k)}</option>`).join("");

document.addEventListener("submit", async e => {

document.addEventListener("pointerover", chartHover);

/* Drag and drop on boards (mouse; touch uses the status buttons) */

/* ---------- Boot ---------- */
function subscribe() {
  const db = S.db;
  const timer = setTimeout(() => {
    if (S.loaded.tasks) return; S.slow = true; schedule();
    if (S.mode === "firebase") db.collection("tasks").limit(1).get({ source: "server" }).then(() => {}).catch(e => { S.dataErr = (e && (e.code ? e.code + ": " : "") + (e.message || "")) || "error"; schedule(); });
  }, 10000);
  // Firebase does not re-send a snapshot when only its source changes (cache → server), so any snapshot counts as loaded there.
  const done = k => snap => { if (!snap.metadata.fromCache || S.mode === "firebase") { S.loaded[k] = true; if (k === "tasks") { clearTimeout(timer); S.slow = false; } } };
  const fail = k => e => { S.loaded[k] = true; if (k === "tasks") clearTimeout(timer); if (e && k !== "members") S.dataErr = (e.code ? e.code + ": " : "") + (e.message || ""); schedule(); };
  const keep = u => { S.unsubs.push(u); };
  if (S.mode === "firebase") S.loaded.members = true;
  else keep(db.collection("members").onSnapshot(snap => { const m = {}; snap.docs.forEach(d => { m[d.id] = d.data(); }); S.members = m; done("members")(snap); schedule(); }, fail("members")));
  keep(db.collection("tasks").onSnapshot(snap => {
    if (S.me && S.loaded.tasks) snap.docChanges().forEach(ch => {
      const d = ch.doc.data();
      if (ch.type === "added" && d.createdBy && d.createdBy !== S.me && d.createdAt > S.loginAt - 60000)
        toast(t("tPartnerAdded", { name: esc(mName(d.createdBy)), t: esc(d.title), forYou: d.assignee === S.me || d.assignee === "both" ? t("forYou") : "" }), "coral");
      if (ch.type === "modified" && d.status === "done" && d.completedBy && d.completedBy !== S.me && d.completedAt > now() - 30000)
        toast(t("tPartnerDone", { name: esc(mName(d.completedBy)), t: esc(d.title) }), "good");
    });
    S.tasks = snap.docs.map(d => Object.assign({ id: d.id }, d.data())); done("tasks")(snap); schedule();
  }, fail("tasks")));
  keep(db.collection("leads").onSnapshot(snap => { S.leads = snap.docs.map(d => Object.assign({ id: d.id }, d.data())); done("leads")(snap); schedule(); }, fail("leads")));
  keep(db.collection("subscriptions").onSnapshot(snap => { S.subs = snap.docs.map(d => Object.assign({ id: d.id }, d.data())); schedule(); }, fail("subscriptions")));
  keep(db.collection("payments").onSnapshot(snap => { S.payments = snap.docs.map(d => Object.assign({ id: d.id }, d.data())); schedule(); }, fail("payments")));
  keep(db.collection("clientwork").onSnapshot(snap => { S.work = snap.docs.map(d => Object.assign({ id: d.id }, d.data())); schedule(); }, fail("clientwork")));
  keep(db.doc("settings/general").onSnapshot(d => { S.settings = (d && d.exists) ? (d.data() || {}) : {}; schedule(); }, () => {}) || (() => {}));
  keep(db.collection("content").onSnapshot(snap => { S.content = snap.docs.map(d => Object.assign({ id: d.id }, d.data())); done("content")(snap); schedule(); setTimeout(checkReminders, 500); }, fail("content")));
  keep(db.collection("portfolio").onSnapshot(snap => { S.portfolio = snap.docs.map(d => Object.assign({ id: d.id }, d.data())); done("portfolio")(snap); schedule(); }, fail("portfolio")));

}
function stopData() {
  S.unsubs.forEach(u => { try { u(); } catch (e) {} }); S.unsubs = [];
  S.dataErr = null; S.slow = false; S.tasks = []; S.leads = []; S.portfolio = []; S.activity = []; S.subs = []; S.payments = []; S.work = []; S.content = []; S.settings = {}; S.loaded = { seats: S.loaded.seats, members: S.loaded.members }; S.subscribed = false;
}

/* ---------- Firebase mode (any device, outside claude.ai) ---------- */
function loadScript(src) {
  return new Promise((res, rej) => { const el = document.createElement("script"); el.src = src; el.onload = res; el.onerror = () => rej(new Error("load " + src)); document.head.appendChild(el); });
}
function userEmail(u) {
  const bytes = new TextEncoder().encode(String(u).trim().toLowerCase());
  return "u" + Array.from(bytes).map(x => x.toString(16).padStart(2, "0")).join("") + "@users.highmedia.app";
}
const USER_RE = /^[\p{L}\p{N}._-]{3,20}$/u;
async function resolveMember(u) {
  const snap = await S.db.collection("members").where("uid", "==", u.uid).limit(1).get();
  return snap.empty ? null : snap.docs[0].id;
}
function enterAs(id) {
  if (S.me !== id) { S.me = id; S.loginAt = now(); S.seenAt = store.get("seen." + id) || 0; }
  S.login = { member: null, pin: "", first: "", error: "", busy: false, shake: false, forgot: false };
  if (!S.subscribed) { S.subscribed = true; subscribe(); }
  if (!VIEWS.includes(location.hash.slice(1))) { S.view = "overview"; try { history.replaceState(null, "", "#overview"); } catch (e) {} }
}
async function fbSignIn(username, pw) {
  if (!username.trim() || !pw) return;
  S.login.busy = true; S.login.error = ""; render();
  try { await S.auth.signInWithEmailAndPassword(userEmail(username), pw); }
  catch (e) { const c = (e && e.code) || ""; S.login.error = c.includes("too-many") ? "tooMany" : c.includes("network") ? "offlineErr" : "eWrongLogin"; }
  S.login.busy = false; render();
}
async function fbCreate(username, pw, pw2) {
  const L = S.login; const seat = L.member; L.error = "";
  if (!USER_RE.test(username.trim())) { L.error = "eUserFormat"; return render(); }
  if (pw.length < 8) { L.error = "ePassShort"; return render(); }
  if (pw !== pw2) { L.error = "ePassMismatch"; return render(); }
  L.busy = true; S.creating = true; render();
  let cred;
  try { cred = await S.auth.createUserWithEmailAndPassword(userEmail(username), pw); }
  catch (e) {
    const c = (e && e.code) || ""; S.creating = false; L.busy = false;
    L.error = c.includes("email-already-in-use") ? "eUserTaken" : c.includes("network") ? "offlineErr" : c.includes("weak-password") ? "ePassShort" : c.includes("too-many") ? "tooMany" : "eSave";
    return render();
  }
  try {
    const at = now(); const batch = S.db.batch();
    batch.set(S.db.doc("members/" + seat), { uid: cred.user.uid, username: username.trim(), claimedAt: at });
    batch.set(S.db.doc("seats/" + seat), { claimed: true, at });
    await batch.commit();
  } catch (e) {
    try { await cred.user.delete(); } catch (x) { try { await S.auth.signOut(); } catch (y) {} }
    S.creating = false; L.busy = false; L.error = "eSeatTaken"; return render();
  }

}
async function bootFirebase(cfg) {

  try {
    if (!window.firebase) { await loadScript(base + "firebase-app-compat.js"); await Promise.all([loadScript(base + "firebase-auth-compat.js"), loadScript(base + "firebase-firestore-compat.js"), loadScript(base + "firebase-storage-compat.js").catch(() => null)]); }
    else if (!firebase.storage) await loadScript(base + "firebase-storage-compat.js").catch(() => null);

  try { await fdb.enablePersistence({ synchronizeTabs: true }); } catch (e) {}
  S.db = fdb; S.auth = firebase.auth(); S.dbState = "ready"; S.loaded.members = true; S.seats = {};
  fdb.collection("seats").onSnapshot(snap => { const m = {}; snap.docs.forEach(d => { m[d.id] = !!(d.data() || {}).claimed; }); S.seats = m; S.loaded.seats = true; schedule(); }, () => { S.loaded.seats = true; schedule(); });
  S.auth.onAuthStateChanged(async u => {
    S.authReady = true;
    if (S.creating) return;
    if (u) {
      let id = null; try { id = await resolveMember(u); } catch (e) {}
      if (!id) { S.login.error = "notTeam"; try { await S.auth.signOut(); } catch (e) {} render(); return; }
      enterAs(id);
    } else { if (S.subscribed) stopData(); S.me = null; }
    render();

}
async function boot() {
  if (swOk()) ensureSW();
  const c = window.claude; const cfg = window.HM_CONFIG;
  const inArtifact = !!(c && c.use);
  if (inArtifact) {
    const sess = store.get("session");
    if (sess && MIDS.includes(sess.id) && now() - sess.at < 30 * DAY) { S.me = sess.id; S.seenAt = store.get("seen." + sess.id) || 0; }
  }
  const h = location.hash.slice(1);

  render();
  if (!inArtifact) {

    S.dbState = window.HM_HOSTED ? "setup" : "absent"; render(); return;
  }
  const [db, user] = await Promise.all([c.use("db").catch(() => null), c.use("user").catch(() => null)]);

boot();
})();
