<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0D17">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<script>window.HM_HOSTED = true;</script>
<script src="config.js"></script>
</head>
<body>
<title>HIGH MEDIA Portal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Cairo:wght@600;700;800&display=swap">
<style>
/* Layout: sidebar app shell (icon rail on tablets, bottom tab bar on phones), side drawer for details; dark navy brand ground first, light theme mirrored; full RTL for Arabic via logical properties. */
:root{
  --bg:#0B0D17; --surface:#121524; --surface-2:#181C2E; --surface-3:#20253B; --line:#272C45; --line-2:#343A58;
  --fg:#F4F2EE; --fg-2:#B4B2C8; --muted:#7D7E98;
  --violet:#8B63F7; --coral:#F05A35; --coral-deep:#8E3A2B; --ink-on-accent:#FFFFFF;
  --c-faisal:var(--violet); --c-abd:var(--coral);
  --good:#3DBE86; --warn:#E9B341; --bad:#FF5C7A; --info:#6EA8FF;
  --tint-violet:rgba(139,99,247,.16); --tint-coral:rgba(240,90,53,.16); --tint-good:rgba(61,190,134,.15);
  --tint-warn:rgba(233,179,65,.15); --tint-bad:rgba(255,92,122,.15); --tint-info:rgba(110,168,255,.15); --tint-pink:rgba(232,92,170,.16); --tint-teal:rgba(47,191,174,.15);
  --pink:#EC74B8; --teal:#3CC9B8;
  --shadow:0 18px 50px rgba(0,0,0,.45);
  --dot:rgba(255,255,255,.06);
  --f-brand:"Archivo","Arial Black","Helvetica Neue",Arial,sans-serif;
  --f-display:"Archivo","Arial Black","Helvetica Neue",Arial,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#F5F4F1; --surface:#FFFFFF; --surface-2:#F0EFF5; --surface-3:#E6E4EF; --line:#E3E1EA; --line-2:#D2CFDD;
  --fg:#11131F; --fg-2:#4D4E66; --muted:#7A7B92;
  --violet:#6A3FE6; --coral:#E04E2A; --coral-deep:#B5462E;
  --good:#18925C; --warn:#A87406; --bad:#D22D52; --info:#2F6FD6;
  --tint-violet:rgba(106,63,230,.10); --tint-coral:rgba(224,78,42,.10); --tint-good:rgba(24,146,92,.10);
  --tint-warn:rgba(168,116,6,.12); --tint-bad:rgba(210,45,82,.10); --tint-info:rgba(47,111,214,.10); --tint-pink:rgba(196,51,133,.10); --tint-teal:rgba(17,140,126,.10);
  --pink:#C43385; --teal:#118C7E;
  --shadow:0 18px 50px rgba(17,19,31,.16); --dot:rgba(17,19,31,.07);
  color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#F5F4F1; --surface:#FFFFFF; --surface-2:#F0EFF5; --surface-3:#E6E4EF; --line:#E3E1EA; --line-2:#D2CFDD;
  --fg:#11131F; --fg-2:#4D4E66; --muted:#7A7B92;
  --violet:#6A3FE6; --coral:#E04E2A; --coral-deep:#B5462E;
  --good:#18925C; --warn:#A87406; --bad:#D22D52; --info:#2F6FD6;
  --tint-violet:rgba(106,63,230,.10); --tint-coral:rgba(224,78,42,.10); --tint-good:rgba(24,146,92,.10);
  --tint-warn:rgba(168,116,6,.12); --tint-bad:rgba(210,45,82,.10); --tint-info:rgba(47,111,214,.10); --tint-pink:rgba(196,51,133,.10); --tint-teal:rgba(17,140,126,.10);
  --pink:#C43385; --teal:#118C7E;
  --shadow:0 18px 50px rgba(17,19,31,.16); --dot:rgba(17,19,31,.07);
  color-scheme:light;
}
:root[lang="ar"]{
  --f-display:"Cairo","IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Figtree",Tahoma,"Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
a{color:inherit}
:focus-visible{outline:2px solid var(--violet);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{margin:0;text-wrap:balance}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:12px;letter-spacing:-.01em}
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:600}
:root[lang="ar"] .eyebrow,:root[lang="ar"] .sec-h h3,:root[lang="ar"] .day-h{letter-spacing:0;text-transform:none;font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
[dir="rtl"] .ic.flip{transform:scaleX(-1)}
.ltr{direction:ltr;unicode-bidi:isolate}

/* Wordmark (always Latin brand type) */
.wm{display:flex;flex-direction:column;line-height:.86;direction:ltr}
.wm b{font-family:var(--f-brand);font-stretch:125%;font-weight:900;letter-spacing:-.01em;font-size:56px;color:var(--fg)}
.wm span{font-family:var(--f-brand);font-stretch:125%;font-weight:300;letter-spacing:.42em;font-size:26px;color:var(--fg-2);margin-top:12px}
.wm.sm b{font-size:19px}
.wm.sm span{font-size:9px;margin-top:5px;letter-spacing:.5em}
.logo{display:block;flex:none;max-width:100%;height:auto}
.logo .pill{fill:var(--fg)}

/* Language switch */
.langbtn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 11px;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--fg-2);font-size:13px;font-weight:600;white-space:nowrap}
.langbtn:hover{color:var(--fg);background:var(--surface-2)}
.langbtn .ic{width:16px;height:16px}
.langbtn .ar{font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif}
.langbtn .en{font-family:"Figtree",Arial,sans-serif}

/* Login */
.login{min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:1.15fr 1fr}
.login-brand{--bg:#0B0D17;--fg:#F4F2EE;--fg-2:#B4B2C8;--muted:#7D7E98;--line:#272C45;--dot:rgba(255,255,255,.06);--coral-deep:#8E3A2B;color:var(--fg);
  position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:40px;
  padding-block:44px;padding-left:max(48px,env(safe-area-inset-left,0px));padding-right:max(48px,env(safe-area-inset-right,0px));
  background-color:var(--bg);background-image:radial-gradient(var(--dot) 1px,transparent 1.2px);background-size:22px 22px;border-inline-end:1px solid var(--line);min-width:0}
.lb-row{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.lockup{display:flex;align-items:center;gap:36px;flex-wrap:wrap;direction:ltr}
[dir="rtl"] .lockup{justify-content:flex-end}
.lb-foot{display:flex;justify-content:space-between;align-items:center;gap:16px;border-top:1px solid var(--line);padding-top:20px;color:var(--fg-2);flex-wrap:wrap}
.dots{display:flex;gap:8px}.dots i{width:10px;height:10px;border-radius:50%;background:var(--violet)}.dots i:nth-child(2){background:var(--coral)}.dots i:nth-child(3){background:var(--fg)}
.login-panel{display:flex;align-items:center;justify-content:center;padding-block:40px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));background:var(--surface);min-width:0}
.lp-inner{width:100%;max-width:400px;display:flex;flex-direction:column;gap:22px}
.lp-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.lp-inner h1{font-family:var(--f-display);font-stretch:112%;font-weight:800;font-size:28px;letter-spacing:-.01em}
:root[lang="ar"] .lp-inner h1,:root[lang="ar"] .ph h1{letter-spacing:0}
.lp-sub{color:var(--fg-2)}
.who{display:flex;align-items:center;gap:14px;width:100%;text-align:start;padding:16px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);transition:border-color .15s,transform .15s}
.who:hover{border-color:var(--line-2);transform:translateY(-1px)}
.who b{display:block;font-size:16px}
.who small{color:var(--muted);font-size:12.5px}
.who .go{margin-inline-start:auto;color:var(--muted)}
.av{width:30px;height:30px;border-radius:50%;background:var(--violet);color:#fff;display:inline-grid;place-items:center;font-weight:700;font-size:13px;flex:none;font-family:var(--f-display);font-stretch:110%;line-height:1}
.av.lg{width:48px;height:48px;font-size:19px}
.av.xl{width:64px;height:64px;font-size:26px}
.av.sm{width:22px;height:22px;font-size:10px}
.avs{display:inline-flex}.avs .av+.av{margin-inline-start:-7px;box-shadow:0 0 0 2px var(--surface)}
.pin-head{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.pin-dots{display:flex;justify-content:center;gap:16px;margin-block:4px;direction:ltr}
.pin-dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line-2)}
.pin-dots i.on{background:var(--fg);border-color:var(--fg)}
.pin-dots.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;direction:ltr}
.pad button{height:56px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.pad button:hover{background:var(--surface-3)}
.pad button:disabled{visibility:hidden}
.err{color:var(--bad);font-size:13px;min-height:20px;text-align:center}
.linkbtn{background:none;border:0;padding:0;color:var(--fg-2);text-decoration:underline;text-underline-offset:3px}
.notice{padding:14px 16px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);color:var(--fg-2)}
.notice b{color:var(--fg)}

/* Shell */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh;min-height:100dvh}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;height:100dvh;display:flex;flex-direction:column;gap:28px;padding-block:24px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));border-inline-end:1px solid var(--line);background:var(--surface)}
.side-brand{display:flex;align-items:center;gap:12px;padding-inline:6px;direction:ltr}
[dir="rtl"] .side-brand{justify-content:flex-end}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;text-decoration:none;color:var(--fg-2);font-weight:500}
.nav a:hover{background:var(--surface-2);color:var(--fg)}
.nav a.on{background:var(--surface-3);color:var(--fg)}
.nav a.on .ic{color:var(--violet)}
.nav em{margin-inline-start:auto;font-style:normal;font-size:11.5px;font-weight:600;min-width:22px;text-align:center;padding:1px 7px;border-radius:999px;background:var(--surface-3);color:var(--fg-2);font-variant-numeric:tabular-nums}
.nav a.on em{background:var(--bg)}
.side-lang{display:flex}
.side-lang .langbtn{width:100%;justify-content:center}
.side-foot{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;background:var(--surface-2)}
.side-lang + .side-foot{margin-top:0}
.side-foot b{display:block;font-size:13.5px}.side-foot small{color:var(--muted);font-size:12px}
.iconbtn{margin-inline-start:auto;display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--fg-2);flex:none}
.iconbtn:hover{color:var(--fg);background:var(--surface-3)}
.main{min-width:0;padding-block:28px 64px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}
.wrap{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.mhead{display:none}

/* Page header */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.ph h1{font-family:var(--f-display);font-stretch:118%;font-weight:800;font-size:30px;letter-spacing:-.015em;margin-top:6px}
.ph-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:38px;padding:0 15px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);font-weight:600;font-size:13.5px;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--violet);border-color:transparent;color:var(--ink-on-accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.good{background:var(--good);border-color:transparent;color:#fff}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn.danger.solid{background:var(--bad);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--fg-2)}
.btn.sm{min-height:30px;padding:0 10px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.banner{padding:12px 16px;border-radius:12px;border:1px solid var(--line);background:var(--tint-warn);color:var(--fg)}

/* Cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card-h h2{font-size:15px;font-weight:700}
.card-h p{color:var(--muted);font-size:12.5px}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:18px}
.g2.even{grid-template-columns:repeat(2,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:4px;text-decoration:none;min-width:0}
.kpi:hover{border-color:var(--line-2)}
.kpi .k-l{color:var(--fg-2);font-size:12.5px;font-weight:600}
.kpi .k-v{font-family:var(--f-display);font-stretch:112%;font-weight:800;font-size:32px;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .k-s{font-size:12.5px;color:var(--muted)}
.kpi .k-s.bad{color:var(--bad)}

/* Segmented + filters */
.seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);gap:2px;max-width:100%}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;font-size:13px;font-weight:600;color:var(--fg-2);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.seg.status{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.seg.status button{padding:7px 4px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sel,.inp{height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 11px;font-size:13.5px;min-width:0;max-width:100%}
.search{position:relative;flex:1 1 200px;max-width:320px}
.search .ic{position:absolute;inset-inline-start:10px;top:9px;color:var(--muted)}
.search input{width:100%;padding-inline-start:34px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--fg-2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--fg);border-color:var(--violet)}
.tabs button em{font-style:normal;color:var(--muted);margin-inline-start:6px;font-variant-numeric:tabular-nums}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:6px;min-height:22px;padding:0 8px;border-radius:6px;font-size:11.5px;font-weight:600;white-space:nowrap;background:var(--surface-3);color:var(--fg-2)}
.chip.website{background:var(--tint-violet);color:var(--violet)}
.chip.reels{background:var(--tint-coral);color:var(--coral)}
.chip.posts{background:var(--tint-pink);color:var(--pink)}
.chip.page{background:var(--tint-teal);color:var(--teal)}
.chip.st-potential{background:var(--tint-info);color:var(--info)}
.chip.st-discussion{background:var(--tint-violet);color:var(--violet)}
.chip.st-closing{background:var(--tint-warn);color:var(--warn)}
.chip.st-client{background:var(--tint-good);color:var(--good)}
.chip.st-lost{background:var(--tint-bad);color:var(--bad)}
.chip.sgc-doctor{background:var(--tint-teal);color:var(--teal)}
.chip.sgc-store{background:var(--tint-violet);color:var(--violet)}
.chip.sgc-restaurant{background:var(--tint-coral);color:var(--coral)}
.chip.sgc-beauty{background:var(--tint-pink);color:var(--pink)}
.chip.sgc-realestate{background:var(--tint-info);color:var(--info)}
.chip.sgc-company{background:var(--tint-warn);color:var(--warn)}
.fchips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin;max-width:100%}
.fchip{display:inline-flex;align-items:center;gap:7px;min-height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg-2);font-weight:600;font-size:13px;white-space:nowrap}
.fchip:hover{border-color:var(--line-2);color:var(--fg)}
.fchip.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.fchip em{font-style:normal;font-size:11.5px;opacity:.7;font-variant-numeric:tabular-nums}
.fchip .dot{width:8px;height:8px;border-radius:50%}
.chip.hi{background:var(--tint-bad);color:var(--bad)}
.chip.new{background:var(--coral);color:#fff}
.due{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);white-space:nowrap}
.due.soon{color:var(--warn)}.due.over{color:var(--bad);font-weight:600}
.due .ic{width:14px;height:14px}

/* Board */
.board{display:grid;grid-template-columns:repeat(var(--cols,4),minmax(250px,1fr));gap:14px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:180px;scroll-snap-align:start;min-width:0}
.col.drop{border-color:var(--violet);background:var(--tint-violet)}
.col-h{display:flex;align-items:center;gap:8px;padding:2px 4px 4px}
.col-h b{font-size:13px}
.col-h em{font-style:normal;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.col-h .sw{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.col-empty{color:var(--muted);font-size:12.5px;padding:14px 6px;text-align:center;border:1px dashed var(--line-2);border-radius:12px}
.tcard{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 12px 11px;display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:border-color .15s;min-width:0}
.tcard:hover{border-color:var(--line-2)}
.tcard.dragging{opacity:.5}
.tcard h4{font-size:14px;font-weight:600;line-height:1.4;overflow-wrap:anywhere}
.tc-top{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tc-client{font-size:12.5px;color:var(--fg-2);overflow-wrap:anywhere}
.tc-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.prog{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted)}
.prog .bar{flex:1;height:4px;border-radius:4px;background:var(--surface-3);overflow:hidden}
.prog .bar span{display:block;height:100%;background:var(--violet);border-radius:4px}

function fmtD(ms) { if (!ms) return ""; const d = new Date(ms); return `${d.getDate()} ${MONTHS[LANG][d.getMonth()]} ${d.getFullYear()}`; }
function fmtDM(ms) { const d = new Date(ms); return `${d.getDate()} ${MONTHS[LANG][d.getMonth()]}`; }
function fmtT(ms) { const d = new Date(ms); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }
const dateMs = s => new Date(s + "T12:00:00").getTime();
function rel(ms) {
  if (!ms) return ""; const s = (now() - ms) / 1000;
  if (s < 60) return t("justNow"); if (s < 3600) return t("mAgo", { n: Math.floor(s / 60) });
  if (s < 86400) return t("hAgo", { n: Math.floor(s / 3600) }); if (s < 172800) return t("yesterday");
  if (s < 7 * 86400) return t("dAgo", { n: Math.floor(s / 86400) }); return fmtD(ms);
}
function dayKey(ms) { const d = new Date(ms); return d.getFullYear() + "-" + d.getMonth() + "-" + d.getDate(); }
function dayLabel(ms) {
  if (dayKey(ms) === dayKey(now())) return t("today"); if (dayKey(ms) === dayKey(now() - DAY)) return t("yesterdayCap");
  const d = new Date(ms); return `${WEEKDAYS[LANG][d.getDay()]} ${d.getDate()} ${MONTHS[LANG][d.getMonth()]} ${d.getFullYear()}`;
}
function dueInfo(due, done) {
  if (!due) return null;
  const end = new Date(due + "T23:59:59").getTime(); if (isNaN(end)) return null;
  const label = fmtDM(dateMs(due));
  if (done) return { cls: "", text: label };
  const days = Math.floor((end - now()) / DAY);
  if (end < now()) { const late = Math.max(1, Math.ceil((now() - end) / DAY)); return { cls: "over", text: t("overdueBy", { n: late, date: label }), over: true }; }
  if (days === 0) return { cls: "soon", text: t("dueToday"), soon: true };
  if (days === 1) return { cls: "soon", text: t("dueTomorrow"), soon: true };
  if (days < 7) return { cls: "soon", text: t("dueIn", { n: days, date: label }), soon: true };
  return { cls: "", text: label };
}

/* ---------- Toasts ---------- */
function toast(html, kind = "") {
  const el = document.createElement("div"); el.className = "toast " + kind; el.innerHTML = html;
  $("#toasts").appendChild(el); setTimeout(() => el.remove(), kind === "bad" ? 7000 : 4500);

function writeErr(e) {
  const code = e && e.code;
  if (code === "invalid_argument") { S.readOnly = true; toast(t("eReadOnly"), "bad"); schedule(); }
  else if (code === "permission-denied") toast(t("eNoPermission"), "bad");
  else if (code === "quota_exceeded") toast(t("eQuota"), "bad");
  else if (code === "resource_exhausted") toast(t("eRate"), "bad");
  else toast(t("eSave"), "bad");
}
async function guard(fn) {
  if (!S.db) { toast(t("eNotConnected"), "bad"); return false; }

  try { await fn(); return true; } catch (e) { writeErr(e); return false; }
}

  const wasDone = tk.status === "done";

  if (ok) {

/* ---------- PIN login ---------- */
async function hashPin(id, pin) {
  const data = new TextEncoder().encode("highmedia:" + id + ":" + pin);
  try { const b = await crypto.subtle.digest("SHA-256", data); return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, "0")).join(""); }
  catch (e) { let h = 5381; for (const c of data) h = ((h << 5) + h + c) | 0; return "d" + (h >>> 0).toString(16); }
}
function pinMode() {
  const m = S.members[S.login.member];
  if (!S.loaded.members) return "loading";
  if (m && m.pinHash) return "enter";
  return S.login.first ? "confirm" : "create";
}
function pinDigit(d) {
  const L = S.login; if (L.busy || L.pin.length >= 4 || pinMode() === "loading") return;
  L.pin += d; L.error = ""; L.shake = false; render();
  if (L.pin.length === 4) { L.busy = true; setTimeout(pinComplete, 140); }
}
async function pinComplete() {
  const L = S.login; const id = L.member; const mode = pinMode();
  try {
    if (mode === "enter") {
      const h = await hashPin(id, L.pin);
      if (h === S.members[id].pinHash) return signIn(id);
      L.error = "pinWrong"; L.shake = true;
    } else if (mode === "create") { L.first = L.pin; }
    else if (mode === "confirm") {
      if (L.pin !== L.first) { L.error = "pinMismatch"; L.first = ""; L.shake = true; }
      else {
        const h = await hashPin(id, L.pin);
        const ok = await guard(() => S.db.doc("members/" + id).set({ pinHash: h, pinSetAt: now() }));
        if (ok) { signIn(id); logAct("account", "pin_created", {}, null); return; }
        L.first = "";
      }
    }
  } finally { L.pin = ""; L.busy = false; render(); }
}
function signIn(id) {
  S.me = id; S.loginAt = now(); S.seenAt = store.get("seen." + id) || 0;
  store.set("session", { id, at: now() });
  S.login = { member: null, pin: "", first: "", error: "", busy: false, shake: false, forgot: false };
  if (!VIEWS.includes(location.hash.slice(1))) { S.view = "overview"; try { history.replaceState(null, "", "#overview"); } catch (e) { location.hash = "overview"; } }
  render();
}
function signOut() {
  if (S.me) store.set("seen." + S.me, now());

/* ---------- Derived data ---------- */
const isMine = x => x.assignee === S.me || x.assignee === "both";
const openTasks = () => S.tasks.filter(x => x.status !== "done");
const activeLeads = () => S.leads.filter(l => ["potential","discussion","closing"].includes(l.stage));
const clients = () => S.leads.filter(l => l.stage === "client");

function sortTasks(list) {
  const pr = { high: 0, normal: 1, low: 2 };
  return list.slice().sort((a, b) => {
    const ad = a.due || "9999", bd = b.due || "9999"; if (ad !== bd) return ad < bd ? -1 : 1;
    const pa = pr[a.priority] ?? 1, pb = pr[b.priority] ?? 1; if (pa !== pb) return pa - pb;
    return (b.createdAt || 0) - (a.createdAt || 0);
  });
}

/* ---------- Chart ---------- */
function weekStarts(n) {
  const s = new Date(); s.setHours(0, 0, 0, 0); s.setDate(s.getDate() - s.getDay());
  const out = []; for (let i = n - 1; i >= 0; i--) { const d = new Date(s); d.setDate(s.getDate() - 7 * i); out.push(d.getTime()); }
  return out;
}
function completionEvents(mode) {
  const ev = [];
  if (mode === "tasks") S.tasks.forEach(x => { if (x.status === "done" && x.completedBy && x.completedAt) ev.push({ by: x.completedBy, at: x.completedAt }); });
  else S.tasks.forEach(x => (x.checklist || []).forEach(c => { if (c.done && c.doneBy && c.doneAt) ev.push({ by: c.doneBy, at: c.doneAt }); }));
  return ev;
}
function niceTop(max) { if (max <= 4) return { top: 4, step: 1 }; for (const s of [2, 5, 10, 20, 25, 50, 100, 200]) if (Math.ceil(max / s) <= 4) return { top: Math.ceil(max / s) * s, step: s }; return { top: max, step: max }; }
function barPath(x, y, w, h) { const r = Math.min(4, w / 2, h); return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`; }
let chartRows = [];
function chartHTML() {
  const mode = S.chartMode; const starts = weekStarts(8); const end = starts[starts.length - 1] + 7 * DAY;
  const rows = starts.map(s => ({ s, faisal: 0, abdulrahman: 0 }));
  const evs = completionEvents(mode);
  evs.forEach(e => { if (e.at < starts[0] || e.at >= end) return; let i = starts.length - 1; while (i > 0 && e.at < starts[i]) i--; if (rows[i][e.by] != null) rows[i][e.by]++; });
  chartRows = rows;
  const tot = { faisal: rows.reduce((a, r) => a + r.faisal, 0), abdulrahman: rows.reduce((a, r) => a + r.abdulrahman, 0) };
  const all = tot.faisal + tot.abdulrahman;
  const W = 600, H = 210, ml = 26, mr = 6, mt = 10, mb = 26, pw = W - ml - mr, phh = H - mt - mb;
  const { top, step } = niceTop(Math.max(...rows.map(r => Math.max(r.faisal, r.abdulrahman))));
  const y = v => mt + phh - (v / top) * phh; const gw = pw / rows.length; const bw = Math.min(18, gw * .3);
  let g = "";
  for (let v = 0; v <= top; v += step) g += `<line class="${v === 0 ? "base" : "gl"}" x1="${ml}" x2="${W - mr}" y1="${y(v)}" y2="${y(v)}"/><text x="${ml - 8}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  rows.forEach((r, i) => {
    const cx = ml + gw * i + gw / 2;
    g += `<rect class="hit" data-i="${i}" x="${ml + gw * i + 2}" y="${mt}" width="${gw - 4}" height="${phh}" rx="6"/>`;
    [["faisal", cx - bw - 1], ["abdulrahman", cx + 1]].forEach(([k, x]) => { if (r[k] > 0) g += `<path d="${barPath(x, y(r[k]), bw, y(0) - y(r[k]))}" fill="${k === "faisal" ? "var(--c-faisal)" : "var(--c-abd)"}" pointer-events="none"/>`; });
    g += `<text x="${cx}" y="${H - 8}" text-anchor="middle">${esc(fmtDM(r.s))}</text>`;
  });
  const n0 = new Date();
  const thisMonth = evs.filter(e => { const d = new Date(e.at); return d.getMonth() === n0.getMonth() && d.getFullYear() === n0.getFullYear(); });
  const mf = thisMonth.filter(e => e.by === "faisal").length, ma = thisMonth.filter(e => e.by === "abdulrahman").length;
  const noun = t(mode === "tasks" ? "nounTasks" : "nounSteps");
  return `<div class="card-h"><div><h2>${t("chartTitle")}</h2><p>${t("chartSub", { noun })}</p></div>
    <div class="seg" role="group"><button class="${mode === "tasks" ? "on" : ""}" data-action="chart-mode" data-m="tasks">${t("segTasks")}</button><button class="${mode === "steps" ? "on" : ""}" data-action="chart-mode" data-m="steps">${t("segSteps")}</button></div></div>
    <div class="legend"><span><i style="background:var(--c-faisal)"></i>${mName("faisal")} <b>${tot.faisal}</b></span><span><i style="background:var(--c-abd)"></i>${mName("abdulrahman")} <b>${tot.abdulrahman}</b></span></div>
    ${all === 0 ? `<div class="empty" style="padding:30px 10px"><b>${t("noneDone", { noun })}</b><span>${t("noneDoneSub")}</span></div>` :
    `<div class="chart" id="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t("chartAria", { noun }))}">${g}</svg><div class="tip" id="tip" hidden></div></div>`}
    <div style="margin-top:12px"><div class="legend" style="margin:0;justify-content:space-between"><span>${t("thisMonth")}: ${mName("faisal")} <b>${mf}</b></span><span>${mName("abdulrahman")} <b>${ma}</b></span></div>
    <div class="split" style="direction:ltr">${mf + ma ? `<span style="width:${mf / (mf + ma) * 100}%;background:var(--c-faisal)"></span><span style="flex:1;background:var(--c-abd)"></span>` : ""}</div></div>
    <details class="tbl"><summary>${t("viewTable")}</summary><div class="tablewrap"><table><thead><tr><th>${t("weekStarting")}</th><th class="n">${mName("faisal")}</th><th class="n">${mName("abdulrahman")}</th></tr></thead><tbody>${rows.slice().reverse().map(r => `<tr><td>${fmtD(r.s)}</td><td class="n">${r.faisal}</td><td class="n">${r.abdulrahman}</td></tr>`).join("")}</tbody></table></div></details>`;
}
function chartHover(e) {
  const hit = e.target.closest && e.target.closest(".hit"); const tip = $("#tip"); if (!tip) return;
  if (!hit) { tip.hidden = true; return; }
  const r = chartRows[+hit.dataset.i]; if (!r) return;

let raf = 0;

  try { s0 = a.selectionStart; s1 = a.selectionEnd; } catch (e) {}

  if (!S.me) { $("#drawer-root").innerHTML = ""; document.body.style.overflow = ""; renderLogin(); return; }
  renderShell(); renderNav();

  main.innerHTML = v === "tasks" ? renderTasks() : v === "leads" ? renderLeads() : v === "portfolio" ? renderPortfolio() : v === "activity" ? renderActivity() : renderOverview();
  const nb = $(".board", main); if (nb && bl) nb.scrollLeft = bl;

}

document.addEventListener("click", async e => {
  const el = e.target.closest("[data-action]"); if (!el) return;
  const a = el.dataset.action, id = el.dataset.id;
  switch (a) {
    case "lang": setLang(LANG === "ar" ? "en" : "ar"); break;
    case "pick": S.login.member = id; S.login.pin = ""; S.login.first = ""; S.login.error = ""; S.login.forgot = false; render(); break;
    case "pick-back": S.login.member = null; S.login.pin = ""; S.login.first = ""; S.login.error = ""; if (MIDS.includes(location.hash.slice(1))) { try { history.replaceState(null, "", location.pathname + location.search); } catch (err) {} } render(); break;
    case "pin": pinDigit(el.dataset.d); break;
    case "pin-del": S.login.pin = S.login.pin.slice(0, -1); render(); break;
    case "forgot": S.login.forgot = true; render(); break;
    case "reset-pin": { const m = S.login.member; if (await guard(() => S.db.doc("members/" + m).set({ pinHash: null, resetAt: now() }))) { toast(esc(t("pinResetDone", { name: mName(m) })), "good"); S.login.forgot = false; render(); } break; }
    case "logout": signOut(); break;
    case "new-task": openDrawer("new-task"); break;
    case "new-lead": openDrawer("new-lead"); break;
    case "new-project": openDrawer("project", null, { client: el.dataset.client || "" }); break;
    case "edit-project": openDrawer("project", id); break;
    case "open-task": openDrawer("task", id); break;
    case "open-lead": openDrawer("lead", id); break;
    case "close": closeDrawer(); break;
    case "quick-done": el.classList.add("on"); await setStatus(id, "done"); break;
    case "set-status": await setStatus(id, el.dataset.st); break;
    case "toggle-step": await toggleStep(id, el.dataset.sid); break;
    case "remove-step": await removeStep(id, el.dataset.sid); break;
    case "apply-template": await applyTemplate(id); break;
    case "set-stage": await setStage(id, el.dataset.st); break;
    case "toggle-lstep": await toggleLeadStep(id, el.dataset.sid); break;
    case "remove-lstep": await removeLeadStep(id, el.dataset.sid); break;
    case "ask-confirm": S.confirm = el.dataset.key; renderDrawer(false); { const f = $("#drawer-root form[data-form='lost'] input"); if (f) f.focus(); } break;
    case "cancel-confirm": S.confirm = null; renderDrawer(false); break;
    case "delete-task": await deleteTask(id); break;
    case "delete-lead": await deleteLead(id); break;
    case "delete-note": await deleteNote(id, el.dataset.nid); break;
    case "delete-project": await deleteProject(id); break;
    case "tf-who": S.tf.who = el.dataset.v; render(); break;
    case "pf-type": S.pf.type = el.dataset.v; render(); break;
    case "lf-seg": S.lf.seg = el.dataset.v; render(); break;
    case "af-who": S.af.who = el.dataset.v; render(); break;
    case "lead-tab": S.lf.tab = el.dataset.tab; if (S.view !== "leads") { location.hash = "leads"; e.preventDefault(); } else render(); break;
    case "chart-mode": S.chartMode = el.dataset.m; render(); break;
    case "show-done": S.showAllDone = true; render(); break;
    case "copy": {
      const txt = el.dataset.text;
      try { await navigator.clipboard.writeText(txt); toast(t("tCopied")); }
      catch (err) { const inp = el.closest(".fgrid").querySelector("input[data-field='phone']"); if (inp) { inp.focus(); inp.select(); } toast(t("tCopyManual")); }
      break;
    }
  }
});
document.addEventListener("keydown", e => {
  if (!S.me && S.login.member && S.mode === "pin") {
    if (/^\d$/.test(e.key)) { pinDigit(e.key); e.preventDefault(); }
    else if (e.key === "Backspace") { S.login.pin = S.login.pin.slice(0, -1); render(); }
    return;
  }
  if (e.key === "Escape" && S.drawer) { closeDrawer(); return; }
  if ((e.key === "Enter" || e.key === " ") && e.target.matches('[role="button"][data-action]')) { e.preventDefault(); e.target.click(); }
});
document.addEventListener("input", e => {
  const x = e.target;
  if (x.id && (x.hasAttribute("data-draft") || x.dataset.field)) S.drafts[x.id] = x.value;
  if (x.classList.contains("title-in")) autoGrow(x);
  if (x.dataset.filter === "q") { S.tf.q = x.value; schedule(); }
  if (x.dataset.lfilter === "q") { S.lf.q = x.value; schedule(); }
});
document.addEventListener("change", async e => {
  const x = e.target;
  if (x.dataset.filter && x.dataset.filter !== "q") { S.tf[x.dataset.filter] = x.value; render(); return; }
  if (x.dataset.afilter) { S.af[x.dataset.afilter] = x.value; render(); return; }
  if (x.dataset.lfilter && x.dataset.lfilter !== "q") { S.lf[x.dataset.lfilter] = x.value; render(); return; }
  if (x.dataset.pfilter) { S.pf[x.dataset.pfilter] = x.value; render(); return; }
  const field = x.dataset.field; if (!field) return;
  const val = x.value;
  if (x.dataset.task) {
    const tk = findTask(x.dataset.task); if (!tk) return;
    if (field === "title" && !val.trim()) { x.value = tk.title; delete S.drafts[x.id]; return; }
    if ((tk[field] || "") === val) { delete S.drafts[x.id]; return; }
    const map = { title: ["renamed", { v: val }], assignee: ["assigned", { who: val }], due: val ? ["due_set", { d: val }] : ["due_removed", {}], priority: ["priority", { pr: val }], category: ["category", { cat: val }], clientId: val ? ["client_linked", { name: leadName(findLead(val)) }] : ["client_unlinked", {}], description: ["details", {}] };
    const [code, p] = map[field] || [null, null];
    const ok = await patchTask(tk.id, { [field]: val }, code, p);
    delete S.drafts[x.id];
    if (ok) {
      const nt = field === "title" ? val : tk.title;
      const act = { title: ["task_renamed", { from: tk.title, title: val }], assignee: ["task_assigned", { title: nt, who: val }],
        due: val ? ["task_due", { title: nt, d: val }] : ["task_due_removed", { title: nt }], priority: ["task_priority", { title: nt, pr: val }],
        category: ["task_category", { title: nt, cat: val }], clientId: val ? ["task_client", { title: nt, name: leadName(findLead(val)) }] : ["task_client_removed", { title: nt }],
        description: ["task_details", { title: nt }] }[field];
      if (act) logAct("task", act[0], act[1], tk.id);
    }
    schedule();
  } else if (x.dataset.lead) {
    const lead = findLead(x.dataset.lead); if (!lead) return;
    if ((lead[field] || "") === val) { delete S.drafts[x.id]; return; }
    const ok = await patchLead(lead.id, { [field]: val });
    delete S.drafts[x.id];
    if (ok && ["phone","business","name","segment","service","source","budget"].includes(field)) logAct("lead", "lead_updated", { field, name: leadName(Object.assign({}, lead, { [field]: val })) }, lead.id);
    schedule();
  }
});
document.addEventListener("submit", async e => {
  const f = e.target; const kind = f.dataset.form; if (!kind) return; e.preventDefault();
  const fd = new FormData(f); const g = k => (fd.get(k) || "").toString().trim();
  const btn = f.querySelector('button[type="submit"]'); if (btn) btn.disabled = true;
  try {
    if (kind === "fb-login") { await fbSignIn((fd.get("username") || "").toString(), (fd.get("password") || "").toString()); return; }
    if (kind === "fb-create") { await fbCreate((fd.get("username") || "").toString(), (fd.get("password") || "").toString(), (fd.get("password2") || "").toString()); return; }
    if (kind === "new-task") {
      if (!g("title")) return;
      const id = await createTask({ title: g("title"), category: g("category"), assignee: g("assignee"), due: g("due"), priority: g("priority"), clientId: g("clientId"), description: g("description"), useTemplate: !!fd.get("useTemplate") });
      if (id) { closeDrawer(); const as = g("assignee"); if (S.tf.who === "mine" && as !== S.me && as !== "both") S.tf.who = "all"; if (S.tf.cat !== "all" && S.tf.cat !== g("category")) S.tf.cat = "all"; if (S.view !== "tasks") location.hash = "tasks"; }
    } else if (kind === "new-lead") {
      if (!g("name") && !g("business")) { toast(t("needNameOrBiz"), "bad"); return; }
      if (!g("segment")) { toast(t("needCat"), "bad"); return; }
      const id = await createLead({ name: g("name"), business: g("business"), phone: g("phone"), segment: g("segment"), service: g("service"), source: g("source"), stage: g("stage"), budget: g("budget") });
      if (id) { S.lf.tab = g("stage") === "client" ? "clients" : "pipeline"; if (S.view !== "leads") location.hash = "leads"; openDrawer("lead", id); }
    } else if (kind === "project") {
      if (!g("title")) return;
      const id = await saveProject(f.dataset.id || null, { clientId: g("clientId"), clientName: g("clientName"), title: g("title"), type: g("type"), segment: g("segment"), url: g("url"), instagram: g("instagram"), deliveredAt: g("deliveredAt"), summary: g("summary"), deliverables: g("deliverables") });
      if (id) { closeDrawer(); if (S.view !== "portfolio") location.hash = "portfolio"; }
    } else if (kind === "add-step") {
      const inp = f.querySelector("input"); if (await addStep(f.dataset.id, inp.value)) { delete S.drafts[inp.id]; inp.value = ""; }
    } else if (kind === "add-lstep") {
      const inp = f.querySelector("input"); if (await addLeadStep(f.dataset.id, inp.value)) { delete S.drafts[inp.id]; inp.value = ""; }
    } else if (kind === "add-note") {
      const ta = f.querySelector("textarea"); if (!ta.value.trim()) return;
      if (await addNote(f.dataset.id, ta.value)) { delete S.drafts[ta.id]; ta.value = ""; toast(t("tNoteSaved"), "good"); }
    } else if (kind === "lost") {
      const inp = f.querySelector("input"); await setStage(f.dataset.id, "lost", inp.value.trim()); delete S.drafts[inp.id];
    }
  } finally { if (btn && btn.isConnected) btn.disabled = false; schedule(); }
});
document.addEventListener("pointerover", chartHover);
window.addEventListener("resize", () => { const ta = $("#drawer-root textarea.title-in"); if (ta) autoGrow(ta); });

/* Drag and drop on boards (mouse; touch uses the status buttons) */
let dragId = null, dragKind = null;
document.addEventListener("dragstart", e => {
  const c = e.target.closest && e.target.closest("[data-drag],[data-ldrag]"); if (!c) return;
  dragId = c.dataset.drag || c.dataset.ldrag; dragKind = c.dataset.drag ? "task" : "lead"; c.classList.add("dragging");
  try { e.dataTransfer.setData("text/plain", dragId); e.dataTransfer.effectAllowed = "move"; } catch (err) {}
});
document.addEventListener("dragend", () => { document.querySelectorAll(".dragging,.drop").forEach(n => n.classList.remove("dragging", "drop")); dragId = null; });
document.addEventListener("dragover", e => {
  const col = e.target.closest && e.target.closest(dragKind === "task" ? "[data-drop]" : "[data-ldrop]"); if (!col || !dragId) return;
  e.preventDefault(); document.querySelectorAll(".drop").forEach(n => n !== col && n.classList.remove("drop")); col.classList.add("drop");
});
document.addEventListener("drop", async e => {
  const col = e.target.closest && e.target.closest(dragKind === "task" ? "[data-drop]" : "[data-ldrop]"); if (!col || !dragId) return;
  e.preventDefault(); const id = dragId; dragId = null;
  if (dragKind === "task") await setStatus(id, col.dataset.drop); else await setStage(id, col.dataset.ldrop);
});

/* ---------- Boot ---------- */
function subscribe() {
  const db = S.db;
  const timer = setTimeout(() => {
    if (S.loaded.tasks) return; S.slow = true; schedule();
    if (S.mode === "firebase") db.collection("tasks").limit(1).get({ source: "server" }).then(() => {}).catch(e => { S.dataErr = (e && (e.code ? e.code + ": " : "") + (e.message || "")) || "error"; schedule(); });
  }, 10000);
  const done = k => snap => { if (!snap.metadata.fromCache) { S.loaded[k] = true; if (k === "tasks") { clearTimeout(timer); S.slow = false; } } };
  const fail = k => e => { S.loaded[k] = true; if (k === "tasks") clearTimeout(timer); if (e && k !== "members") S.dataErr = (e.code ? e.code + ": " : "") + (e.message || ""); schedule(); };
  const keep = u => { S.unsubs.push(u); };
  if (S.mode === "firebase") S.loaded.members = true;
  else keep(db.collection("members").onSnapshot(snap => { const m = {}; snap.docs.forEach(d => { m[d.id] = d.data(); }); S.members = m; done("members")(snap); schedule(); }, fail("members")));
  keep(db.collection("tasks").onSnapshot(snap => {
    if (S.me && S.loaded.tasks) snap.docChanges().forEach(ch => {
      const d = ch.doc.data();
      if (ch.type === "added" && d.createdBy && d.createdBy !== S.me && d.createdAt > S.loginAt - 60000)
        toast(t("tPartnerAdded", { name: esc(mName(d.createdBy)), t: esc(d.title), forYou: d.assignee === S.me || d.assignee === "both" ? t("forYou") : "" }), "coral");
      if (ch.type === "modified" && d.status === "done" && d.completedBy && d.completedBy !== S.me && d.completedAt > now() - 30000)
        toast(t("tPartnerDone", { name: esc(mName(d.completedBy)), t: esc(d.title) }), "good");
    });
    S.tasks = snap.docs.map(d => Object.assign({ id: d.id }, d.data())); done("tasks")(snap); schedule();
  }, fail("tasks")));
  keep(db.collection("leads").onSnapshot(snap => { S.leads = snap.docs.map(d => Object.assign({ id: d.id }, d.data())); done("leads")(snap); schedule(); }, fail("leads")));
  keep(db.collection("portfolio").onSnapshot(snap => { S.portfolio = snap.docs.map(d => Object.assign({ id: d.id }, d.data())); done("portfolio")(snap); schedule(); }, fail("portfolio")));
  keep(db.collection("activity").orderBy("at", "desc").limit(300).onSnapshot(snap => { S.activity = snap.docs.map(d => Object.assign({ id: d.id }, d.data())); done("activity")(snap); schedule(); }, fail("activity")));
}
function stopData() {
  S.unsubs.forEach(u => { try { u(); } catch (e) {} }); S.unsubs = [];
  S.dataErr = null; S.slow = false; S.tasks = []; S.leads = []; S.portfolio = []; S.activity = []; S.loaded = { seats: S.loaded.seats, members: S.loaded.members }; S.subscribed = false;
}

/* ---------- Firebase mode (any device, outside claude.ai) ---------- */
function loadScript(src) {
  return new Promise((res, rej) => { const el = document.createElement("script"); el.src = src; el.onload = res; el.onerror = () => rej(new Error("load " + src)); document.head.appendChild(el); });
}
function userEmail(u) {
  const bytes = new TextEncoder().encode(String(u).trim().toLowerCase());
  return "u" + Array.from(bytes).map(x => x.toString(16).padStart(2, "0")).join("") + "@users.highmedia.app";
}
const USER_RE = /^[\p{L}\p{N}._-]{3,20}$/u;
async function resolveMember(u) {
  const snap = await S.db.collection("members").where("uid", "==", u.uid).limit(1).get();
  return snap.empty ? null : snap.docs[0].id;
}
function enterAs(id) {
  if (S.me !== id) { S.me = id; S.loginAt = now(); S.seenAt = store.get("seen." + id) || 0; }
  S.login = { member: null, pin: "", first: "", error: "", busy: false, shake: false, forgot: false };
  if (!S.subscribed) { S.subscribed = true; subscribe(); }
  if (!VIEWS.includes(location.hash.slice(1))) { S.view = "overview"; try { history.replaceState(null, "", "#overview"); } catch (e) {} }
}
async function fbSignIn(username, pw) {
  if (!username.trim() || !pw) return;
  S.login.busy = true; S.login.error = ""; render();
  try { await S.auth.signInWithEmailAndPassword(userEmail(username), pw); }
  catch (e) { const c = (e && e.code) || ""; S.login.error = c.includes("too-many") ? "tooMany" : c.includes("network") ? "offlineErr" : "eWrongLogin"; }
  S.login.busy = false; render();
}
async function fbCreate(username, pw, pw2) {
  const L = S.login; const seat = L.member; L.error = "";
  if (!USER_RE.test(username.trim())) { L.error = "eUserFormat"; return render(); }
  if (pw.length < 8) { L.error = "ePassShort"; return render(); }
  if (pw !== pw2) { L.error = "ePassMismatch"; return render(); }
  L.busy = true; S.creating = true; render();
  let cred;
  try { cred = await S.auth.createUserWithEmailAndPassword(userEmail(username), pw); }
  catch (e) {
    const c = (e && e.code) || ""; S.creating = false; L.busy = false;
    L.error = c.includes("email-already-in-use") ? "eUserTaken" : c.includes("network") ? "offlineErr" : c.includes("weak-password") ? "ePassShort" : c.includes("too-many") ? "tooMany" : "eSave";
    return render();
  }
  try {
    const at = now(); const batch = S.db.batch();
    batch.set(S.db.doc("members/" + seat), { uid: cred.user.uid, username: username.trim(), claimedAt: at });
    batch.set(S.db.doc("seats/" + seat), { claimed: true, at });
    await batch.commit();
  } catch (e) {
    try { await cred.user.delete(); } catch (x) { try { await S.auth.signOut(); } catch (y) {} }
    S.creating = false; L.busy = false; L.error = "eSeatTaken"; return render();
  }
  S.creating = false; enterAs(seat); logAct("account", "account_created", {}, null); render();
}
async function bootFirebase(cfg) {
  S.mode = "firebase";
  const base = "https://www.gstatic.com/firebasejs/10.12.2/";
  try {
    if (!window.firebase) { await loadScript(base + "firebase-app-compat.js"); await Promise.all([loadScript(base + "firebase-auth-compat.js"), loadScript(base + "firebase-firestore-compat.js")]); }
    if (!firebase.apps.length) firebase.initializeApp(cfg.firebase);
  } catch (e) { S.dbState = "failed"; render(); return; }
  const fdb = firebase.firestore();
  try { await fdb.enablePersistence({ synchronizeTabs: true }); } catch (e) {}
  S.db = fdb; S.auth = firebase.auth(); S.dbState = "ready"; S.loaded.members = true; S.seats = {};
  fdb.collection("seats").onSnapshot(snap => { const m = {}; snap.docs.forEach(d => { m[d.id] = !!(d.data() || {}).claimed; }); S.seats = m; S.loaded.seats = true; schedule(); }, () => { S.loaded.seats = true; schedule(); });
  S.auth.onAuthStateChanged(async u => {
    S.authReady = true;
    if (S.creating) return;
    if (u) {
      let id = null; try { id = await resolveMember(u); } catch (e) {}
      if (!id) { S.login.error = "notTeam"; try { await S.auth.signOut(); } catch (e) {} render(); return; }
      enterAs(id);
    } else { if (S.subscribed) stopData(); S.me = null; }
    render();
  });
}
async function boot() {
  const c = window.claude; const cfg = window.HM_CONFIG;
  const inArtifact = !!(c && c.use);
  if (inArtifact) {
    const sess = store.get("session");
    if (sess && MIDS.includes(sess.id) && now() - sess.at < 30 * DAY) { S.me = sess.id; S.seenAt = store.get("seen." + sess.id) || 0; }
  }
  const h = location.hash.slice(1);
  if (VIEWS.includes(h)) S.view = h; else if (MIDS.includes(h) && !S.me) S.login.member = h;
  render();
  if (!inArtifact) {
    if (cfg && cfg.firebase && cfg.firebase.apiKey) { S.mode = "firebase"; render(); return bootFirebase(cfg); }
    S.dbState = window.HM_HOSTED ? "setup" : "absent"; render(); return;
  }
  const [db, user] = await Promise.all([c.use("db").catch(() => null), c.use("user").catch(() => null)]);
  S.user = user;
  if (!db) { S.dbState = "absent"; render(); return; }
  S.db = db; S.dbState = "ready";
  if (user) {
    try { S.isOwner = await user.isOwner(); } catch (e) {}
    try { const w = await user.can("data.write"); if (w === false) S.readOnly = true; } catch (e) {}
  }
  S.subscribed = true; subscribe(); render();
}
boot();
})();
